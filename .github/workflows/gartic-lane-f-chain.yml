name: Gartic producer LANE F (24/7 self-replenishing fleet)

# Replaces the Camoufox producer fleet, which cannot mint any more:
#
#   1. Its egress is AS8075 Microsoft, which Cloudflare refuses the challenge to
#      (measured 2026-07-24: direct 0 tokens / 93x 600010, WARP 238, VPN Gate 99).
#   2. Its embedded generator renders WITHOUT `action:'join'`, and gartic
#      validates that field server-side -- every such token is refused code 5.
#   3. It pins `camoufox==0.4.11` but `camoufox fetch` now pulls v152, which
#      yields zero tokens.
#
# This workflow is the GitHub port of the recipe that is live and minting on the
# Oracle VM (`tunnel system/vm-chromium-producer/`): a PLAIN Chromium with no
# automation protocol attached, doing the work from an MV3 content script in the
# MAIN world, egressing through an anonymous Cloudflare WARP registration.
#
# On the diagnostic signature that misled the previous session: a healthy
# producer logs `DIAG iframes=0` and fires `before-interactive`. That is what
# `appearance:'interaction-only'` looks like, NOT a failure -- the live VM
# producer prints exactly that while minting. Do not treat it as a verdict.
# The only verdict that counts is the ACCEPTED ratio this workflow prints.

# ─────────────────────────────────────────────────────────────────────────────
# LANE F — 24/7 CONTINUITY. One file, two roles, chosen by the trigger:
#
#   schedule           -> the `supervise` job. Tops the fleet up to
#                         vars.LANE_F_TARGET. This is the AUTHORITY.
#   workflow_dispatch  -> the `produce` job. One minting worker.
#
# Why a scheduled supervisor and not just each job dispatching its heir: a chain
# cannot recover from the cases that actually end a 24/7 fleet. If a runner is
# evicted, or the run is cancelled hard, step 7 never executes and that slot is
# gone forever; if EVERY job dies at once there is nothing left to dispatch and
# the fleet is permanently dead with no human able to notice from the outside. A
# chain also multiplies when it misfires, whereas a supervisor is bounded by
# TARGET by construction. The chain step is kept as a FAST PATH so a replacement
# starts immediately instead of waiting up to a tick, but correctness rests on
# the supervisor alone — the fleet converges to TARGET even with chaining off.
#
# KILL SWITCH: repo variable FLEET_ENABLED. Set it to 0/false and neither the
# supervisor nor any chain step will dispatch anything, so the fleet drains as
# jobs reach their own timeouts (or immediately if you also cancel the runs).
# Set LANE_F_TARGET=0 to stop only this lane. Both are read fresh every cycle.
#
#   gh variable set FLEET_ENABLED  -R <repo> --body 0   # stop everything
#   gh variable set LANE_F_TARGET  -R <repo> --body 4   # this lane's size
#
# ⚠️ GitHub disables `schedule` triggers on a repo with no activity for 60 days,
# which would silently end 24/7 operation. The supervisor pushes a dated
# heartbeat commit (see the last step) using CHAIN_PAT so the repo never goes
# quiet. A commit by GITHUB_TOKEN would NOT count, which is why the PAT is used.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Every 10 min. GitHub delays scheduled runs under load, so this is a
    # convergence floor, not a guarantee; the chain fast-path covers the gap.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to mint for"
        required: false
        default: "300"
      lanes:
        description: "Parallel Turnstile widgets (2 is the measured optimum)"
        required: false
        default: "2"
      per_min:
        description: "Per-IP mint cap. Above ~12-14 gartic refuses everything."
        required: false
        default: "12"
      post_to_relay:
        description: "POST minted tokens to the relay (false = verify only)"
        required: false
        default: "true"
      chain:
        description: "Dispatch a successor when this run ends"
        required: false
        default: "false"
      supervise_now:
        description: "Run ONE supervisor tick by hand instead of a mint job (schedule does this automatically)"
        required: false
        default: "false"
      forbid_exits:
        # Empty by DEFAULT and it must stay that way. WARP's IPv4 is anycast --
        # every lane shares one address (the VM's lanes all sit on
        # 104.28.196.79) and only the IPv6 /64 actually differs. Seeding this
        # with a v4 makes warp_up.sh reject every roll and fail the job: an
        # earlier run burned all 4 rolls on 104.28.196.79/IAD for exactly that
        # reason. Put a v6 prefix here if a real collision needs excluding.
        description: "WARP exits to refuse. Use IPv6 prefixes -- the v4 is anycast and always collides."
        required: false
        default: ""
      appearance:
        # We copied appearance:'interaction-only' from gartic's own client, but
        # we are not gartic's client -- we only need tokens that pass siteverify
        # with action:'join'. How the widget LOOKS is our choice, and this mode
        # is expensive: it stays invisible until Cloudflare demands interaction,
        # which on a datacenter IP is EVERY time (measured: 100% solve=int on
        # runners). Every solve then costs a click and is scrutinised, capping
        # an exit near 12 tok/min.
        #
        # The year-old Camoufox generator set NO appearance -- the default
        # managed widget, which auto-solves with no click -- and sustained
        # ~47 tok/min per IP, 4x what we get. That is the workaround this input
        # exists to test. ('always' renders the widget visibly and lets it
        # self-solve; the click driver is skipped in that mode, since clicking a
        # widget that is already solving only interferes.)
        description: "interaction-only (invisible, needs a click) or always (visible, self-solving)"
        required: false
        default: "interaction-only"
      rotate_fp:
        # The operator's experience, from running this a year ago: a single
        # browser instance decays after a while and its tokens stop being
        # accepted even though Cloudflare keeps issuing them -- and Camoufox was
        # the only thing that fixed it. A bench confirmed the mechanism is real:
        # across 4 Camoufox launches, canvasHash and webglRenderer differed
        # EVERY time while userAgent/platform/timezone stayed constant. So it
        # re-rolls precisely the high-entropy vectors.
        # Chromium never re-rolls anything, and --user-agent/--window-size/--lang
        # CANNOT reach canvas or WebGL, which is why this lives in the extension
        # rather than in flags.
        #
        # ⚠️ MEASURED AND IT DOES NOT WORK. Controlled local A/B, same IP, same
        # 10-minute window, control run LAST (so most depleted):
        #     canvas + WebGL + cores spoof -> 0 minted
        #     canvas noise alone           -> 0 minted
        #     no rotation (control)        -> 20 minted, 4/4 accepted, no cf err
        # Cloudflare detects a JS-level canvas patch and simply stops issuing --
        # not "issues tokens gartic then refuses", but no tokens at all. You
        # cannot fake this from inside the page: any override is visible to the
        # same JS that reads it. Camoufox patches at the C++/Gecko level, which
        # is exactly why it can rotate identity and this cannot.
        # KEEP THIS false. It is retained only to document the negative.
        description: "BROKEN - JS canvas/WebGL spoofing stops Cloudflare issuing entirely. Keep false."
        required: false
        default: "false"
      recycle_min:
        # Rotation only helps if it actually happens again. Reloading the page
        # re-runs the content script with a fresh seed, which is far cheaper
        # than restarting Chromium and loses only the in-flight widgets.
        description: "Reload each page every N minutes to draw a fresh identity (0 = never)"
        required: false
        default: "0"
      click_style:
        # The operator observed, on a degraded IP, that a HAND click on the
        # checkbox succeeded where the synthetic one did not. Cloudflare can
        # hand back a token client-side and still fail it at siteverify if it
        # judged the interaction fraudulent -- which looks exactly like our
        # symptom: getResponse() returns a full-length token (mint counter
        # rises) and gartic then refuses it code=5. So click realism may affect
        # ACCEPTANCE, not just whether a token appears.
        # MEASURED A/B, 3 tunnels, ~20 min apart on rested exits:
        #   simple -> 364 minted, 29/min, 12/12 accepted, 401 clicks
        #   human  -> 193 minted, 16/min, 10/11 accepted, 217 clicks
        # Realism bought nothing on a rested exit and cost 45% of production:
        # each human click issues 20+ synced mousemoves plus an awk spawn, so
        # the driver lands about half as many clicks per cycle and tokens track
        # clicks nearly 1:1. Depletion does not explain it (cumulative ~557 here
        # vs ~2000 when decay set in). Default back to `simple`; `human` stays
        # for the untested case that matters -- whether it extends the budget on
        # a DEPLETED exit, which is where the operator saw a hand click succeed
        # and a synthetic one fail.
        description: "simple (3-hop teleport, faster) or human (eased path, jitter, press-hold)"
        required: false
        default: "simple"
      verify_every:
        # Seconds between acceptance checks. 180 gives only ~4 samples in a
        # 12-minute run, which cannot separate a real acceptance drop from
        # noise -- 4 tunnels scored 2/4 against 3 tunnels' 4/4 and that is not
        # a decidable difference. Each check spends one token (they are
        # single-use), which at 30+/min is under 2% of production.
        description: "Seconds between acceptance checks. Lower = more samples, costs one token each."
        required: false
        default: "180"
      strip_dom:
        # Throughput on a runner is CPU-bound (3 and 5 tunnels both total
        # 27/min), and most of that CPU is gartic's animated Next.js homepage,
        # not Turnstile. We need the origin and window.turnstile, not the UI.
        description: "Drop gartic's DOM once turnstile is captured, to free CPU for solving"
        required: false
        default: "true"
      tunnels:
        # ⚠️ RETRACTED 2026-07-29: the "43/58 and 54/59 accepted" figures below
        # were produced by THIS WORKFLOW'S OWN VERIFIER, which replays each
        # token through the WARP tunnel that minted it. A token from an
        # over-driven exit still passes when redeemed from that same exit, so
        # the instrument was blind to the exact failure it was measuring. It
        # reported 54/59 accepted while icebot was refused 100% code 5 and
        # production was down for an hour.
        #
        # RE-MEASURED with icebot's real joins as ground truth:
        #   1 tunnel  (~11/min per exit) -> 53 joins /    3 code-5  ✅
        #   3 tunnels (~33/min, ONE IP)  -> 27 joins /  175 code-5  ❌ 86% fail
        #   6 tunnels x 20 workers       ->  0 joins / 1041 code-5  ❌ outage
        #
        # WARP's IPv4 is anycast: 5 fresh registrations on one runner all drew
        # 104.28.196.79. So N tunnels is NOT N exits, it is N times the traffic
        # on ONE address, and gartic rate-limits acceptance per solving IP at
        # roughly 12 accepted tok/min. The "quota keys on storage identity"
        # claim is withdrawn -- those 6 tunnels were 6 separate browsers with 6
        # separate --user-data-dirs, i.e. six distinct storage identities, and
        # they still collapsed.
        #
        # Scale by adding EXITS (more runners at 1 tunnel), not tunnels. Verify
        # per exit at https://mohanadino.duckdns.org:8443/stats/exits, which
        # scores each minting IP against icebot's real join verdicts.
        description: "Browsers per runner. WARP's v4 is anycast so these SHARE one exit -- above 1 you are just overdriving it."
        required: false
        default: "1"
      egress:
        # WHY THIS EXISTS. Measured 2026-07-29 with per-exit attribution: tokens
        # minted on a GitHub runner through WARP are accepted at ~4-5%, while the
        # Oracle VM's tokens — same producer stack, same browser, same rates, also
        # through WARP — are accepted at 100% in the same minutes. A single runner
        # is no better than a fleet (1 joined / 22 refused), and mint rate makes no
        # difference (per_min=10 and per_min=30 both collapse to 0%).
        #
        # The leading explanation is that WARP is Cloudflare's OWN product, so it
        # cannot hide an untrusted origin from Cloudflare's own Turnstile: it
        # restored *issuance* from AS8075 but not *standing* at siteverify. If that
        # is right, no number of WARP runners will ever work and the egress has to
        # be something Cloudflare does not operate.
        #
        #   warp     - control, the known-bad ~4% baseline
        #   vpngate  - free volunteer OpenVPN relays, many RESIDENTIAL (JP/KR).
        #              Changes the DEFAULT ROUTE, so no --proxy-server is used and
        #              the relay POST egresses through it too (attribution still
        #              sees the true exit). vpngate.py --index/--stride give N
        #              runners DISJOINT relays instead of all picking the fastest.
        #   webshare - our paid proxies. Diagnostic only: at ~0.75 MB/token, 800
        #              tok/min would be ~25 TB/month, so this can prove the point
        #              but cannot be the production answer.
        #   direct   - control. Expect 600010 (Cloudflare refuses to challenge
        #              AS8075 directly); confirms the runner itself is the problem.
        description: "warp | vpngate | webshare | direct"
        required: false
        default: "warp"
      vpngate_index:
        # Job K of N passes index=K stride=N so concurrent runners take disjoint
        # relays. Without it every runner ranks the feed identically, all pick the
        # same top relay, and they collide on ONE exit — the exact failure that
        # caps WARP's horizontal scale.
        description: "VPN Gate: this job's slice index (0-based)"
        required: false
        default: "0"
      vpngate_stride:
        description: "VPN Gate: total number of concurrent jobs sharing the feed"
        required: false
        default: "1"
      webshare_proxy:
        # One entry, `host:port:user:pass` (the format of the proxy list files).
        description: "webshare egress: host:port:user:pass"
        required: false
        default: ""
      browser:
        # cft136 mints ZERO with no `cf err` at all -- the challenge neither
        # errors nor solves, which is not the AS8075 signature (that is loud
        # 600010). Turnstile is known to weigh browser build age, and 136 is
        # far behind the VM's Chromium 148 that mints fine. `playwright` gets a
        # CURRENT Chromium, which unlike branded Chrome still honours
        # --load-extension when the feature flag is turned off.
        description: "playwright (modern Chromium, recommended) or cft136 (old, native --load-extension)"
        required: false
        default: "playwright"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # THE SUPERVISOR. Scheduled trigger only. Converges the number of live
  # `produce` workers on vars.LANE_F_TARGET and prints one health line.
  # ───────────────────────────────────────────────────────────────────────────
  supervise:
    # `supervise_now=true` runs a tick by hand. GitHub's cron for a newly added
    # scheduled workflow can take a long time to fire the first time (measured:
    # still nothing after 28 min), so without this the supervisor is untestable
    # on the day you write it.
    if: github.event_name == 'schedule' || github.event.inputs.supervise_now == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # A slow tick must be REPLACED, never queued behind its predecessor —
    # otherwise ticks pile up and each one dispatches the same deficit again.
    concurrency:
      group: lane-f-supervisor
      cancel-in-progress: true
    steps:
      # ─────────────────────────────────────────────────────────────────────
      # RATE-BASED, PER PROVIDER. Read this before changing any number here.
      #
      # Acceptance is a dose-response against the TOTAL pipeline mint rate for a
      # provider, evaluated at redemption (Lane A, 2026-07-29):
      #
      #     0-90 tok/min -> 100% | 90-120 -> 66% | 120-150 -> 12% | 150+ -> 0%
      #
      # It is a CLIFF, not a slope. So this supervisor holds an aggregate mint
      # RATE per provider, and NOT a runner count. A count-based target walks
      # straight past 90 tok/min and takes the whole provider to 0% — and since
      # the relay serves newest-first, the refused tokens then crowd out the good
      # ones, so the fleet gets WORSE as it grows. That is the mechanism behind
      # every "scaling up caused an outage" event in this project's history.
      #
      # A runner delivers ~20-25 mint/min, so a 75/min target is **3-4 runners**.
      # NOT twenty. If you are tempted to raise MAX_RUNNERS to get more tokens:
      # you will get FEWER accepted tokens. More capacity comes from adding a
      # PROVIDER (each has its own independent budget), never from adding
      # runners to a provider that is already at its ceiling.
      #
      # Overshoot is far more expensive than undershoot (100% -> 0%, no slope),
      # so we target 75 against a measured 90 threshold and add at most one
      # runner per tick.
      # ─────────────────────────────────────────────────────────────────────
      - name: Hold the provider mint rate under its ceiling, emit health line
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
          GH_REPO: ${{ github.repository }}
          WF: gartic-lane-f-chain.yml
          ENABLED_CTX: ${{ vars.FLEET_ENABLED }}
          RELAY: https://mohanadino.duckdns.org:8443
          RELAY_SECRET: 74b163d6448f638bc82a6c5b9a6e64f1abd06e2bca6c47c148a041a5dc40f434
          # ── PROVIDER BUDGET. All rates are TRUE tok/min (minted deltas). ──
          # PROVIDER selects the jq fold below. Adding/switching a provider is a
          # config change here, not a rewrite of the control loop.
          PROVIDER: "warp"
          TARGET_RATE: "45"      # aim here; headroom beats the last few tokens
          CEILING_RATE: "55"     # Lane A brackets the cliff at 55-60 true
          FLOOR_RATE: "35"       # only add a runner below this (hysteresis)
          # SIZING. Lane C measured 13.7 TRUE tok/min per runner at tunnels=1
          # (three instruments agreeing). The VM anchor contributes ~12 TRUE
          # against this SAME budget, so:
          #     MAX_RUNNERS = ceil( (TARGET_RATE - 12) / 13.7 )
          # At TARGET=45 that is 3, worst case 12 + 3*13.7 = 53.1, just under the
          # 55 ceiling. If Lane D's ramp moves the ceiling, change TARGET_RATE and
          # CEILING_RATE and re-apply that formula; nothing else in the loop
          # changes. The loop then VERIFIES the achieved aggregate each tick
          # rather than assuming the per-runner figure held.
          #
          # tunnels=1 deliberately, even though 2 browsers give ~23.2/min per
          # runner: GRANULARITY BEATS DENSITY. Overshooting the ceiling costs
          # 100% of the provider, not merely the excess, so approaching it in
          # 13.7 steps is far safer than in 23.2 steps.
          #
          # DO NOT RAISE to buy more tokens: past the ceiling the whole provider
          # drops toward 0% and, because the relay serves newest-first, the
          # refused tokens crowd out the good ones. More capacity = another
          # PROVIDER, not more runners on a saturated one.
          RUNNER_RATE: "13.7"
          MAX_RUNNERS: "3"
          # If providers turn out NOT to be independent (Lane B is driving VPN
          # Gate through its cliff while WARP produces), set this to a number and
          # the loop caps TOTAL pipeline output instead of one provider. That is
          # the only change required -- the add/hold/shed logic is untouched.
          GLOBAL_CEILING: ""
          INDEX_BASE: "14"
          STRIDE: "16"
          # ── JOB LIFETIME + PER-RUNNER RETIREMENT ───────────────────────
          # Long jobs were chosen to beat the runner drip-feed (~1 arrival per
          # 6-12 min), NOT because a long-lived runner is good. Evidence on
          # 2026-07-29 says an AS8075 runner is excellent for roughly its first
          # ~400 tokens and a LIABILITY after: two GitHub WARP exits sat at
          # 25-30% acceptance at ~420 tokens each while the Oracle VM held 100%
          # in the same minutes at the same per-exit rate.
          #
          # A runner minting 12/min at 25% acceptance is WORSE THAN NO RUNNER,
          # because the relay serves newest-first, so its bad tokens crowd out
          # good ones from fresh runners. Hence retirement is an acceptance
          # decision, not a liveness or throughput one.
          #
          # ALL THREE RETIREMENT RULES DEFAULT TO OFF (0). Arm them only once
          # the within-exit lifetime curve confirms the budget.
          JOB_MINUTES: "300"        # lifetime of a newly dispatched worker
          # ADMISSION GATE. GitHub is OPPORTUNISTIC; the VM is the dependable
          # floor. One probe runner is admitted, scored on ATTRIBUTABLE verdicts,
          # and GitHub earns more runners only if it is actually being accepted.
          ADMIT_PCT: "60"           # probe must reach this to earn more runners
          RETRY_MIN: "25"           # after a refusal, wait this long before re-probing
          # A REFUSED RUNNER IS WORSE THAN NO RUNNER. The relay serves
          # newest-first, so a GitHub exit at 0% crowds the VM's good tokens out
          # of the queue. Dropping GitHub to zero is therefore a CORRECTNESS
          # requirement, not a cost saving -- do not "leave it running, it might
          # recover": while it does, it is actively destroying the floor.
          RETIRE_TOKENS: "0"        # SAFETY BACKSTOP ONLY (0 = off). The ~400-token
                                    # budget model is DEAD: four exits fell inside one
                                    # 150 s window at counts spanning 351-486, and two
                                    # fresh exits were refused at 5 and 12 tokens.
                                    # Acceptance is the rule; token count is not.
          RETIRE_MINUTES: "0"       # wall-clock fallback if tokens unreadable (0 = off)
          MIN_ACCEPT_PCT: "0"       # retire below this recent acceptance % (0 = off)
          MIN_ACCEPT_SAMPLES: "8"   # ...but only once it has this many verdicts
          RETIRE_DRY_RUN: "false"   # true = report what it WOULD retire, cancel nothing
          SPREAD_MIN: "25"
        run: |
          set -uo pipefail

          # Read the switch LIVE. `vars.FLEET_ENABLED` in an env: block is
          # resolved when the JOB STARTS, so a run already in flight keeps the
          # old value and the kill switch appears to be ignored for one whole
          # generation. Measured: switch set 15:03:23, a successor still went
          # out at 15:06:57 from a job that started 15:00:47.
          # The `vars` context is the RELIABLE source: it needs no token scope and
          # is always a clean value, but it is resolved when the JOB STARTS, so
          # it lags by up to one job lifetime. The live API read would remove
          # that lag -- but CHAIN_PAT is not scoped for it and returns a 403 JSON
          # BODY ON STDOUT, which an `|| echo 1` fallback happily accepts as a
          # value. That silently DEFEATED the kill switch (measured: it
          # dispatched a runner while FLEET_ENABLED=0). So: trust the live value
          # only when it is one of the known-good literals, else keep the
          # context value. Never let an unparseable answer mean "enabled".
          enabled="${ENABLED_CTX:-1}"
          live=$(gh api "repos/$GH_REPO/actions/variables/FLEET_ENABLED" --jq '.value' 2>/dev/null || true)
          case "$live" in 0|1|true|false|no|off|yes|on|TRUE|FALSE) enabled="$live" ;; esac
          case "$(echo "$enabled" | tr 'A-Z' 'a-z')" in
            0|false|no|off) STOP=1 ;; *) STOP=0 ;;
          esac

          # Provider fold. warp = the Cloudflare WARP anycast /16, which now covers
          # BOTH the VM anchor and the GitHub runners on WARP egress -- they are
          # one provider sharing one budget. vpngate = everything else.
          case "$PROVIDER" in
            warp)    SEL='select(.src|startswith("104.28."))' ;;
            vpngate) SEL='select((.src|startswith("104.28."))|not)' ;;
            *)       SEL='select(.)' ;;
          esac
          [ -n "$GLOBAL_CEILING" ] && SEL='select(.)'      # cap the whole pipeline

          # TRUE rate: two samples of cumulative `minted`, 60 s apart.
          # NEVER build this loop on `mintPerMin` -- it was inflating 1.5-1.95x
          # (trimTimes compacted in place without assigning back, so merely
          # READING the endpoint corrupted its own state). A control loop must
          # not depend on a number that a reader can poison.
          snap() { curl -s --max-time 12 -H "X-Auth: $RELAY_SECRET" "$RELAY/stats/exits"                    | jq -r "[.exits[]?|$SEL|.minted]|add // 0" 2>/dev/null || echo 0; }
          m0=$(snap); sleep 60; m1=$(snap)
          case "$m0" in ''|*[!0-9]*) m0=0 ;; esac
          case "$m1" in ''|*[!0-9]*) m1=0 ;; esac
          rate=$(( m1 - m0 )); [ "$rate" -lt 0 ] && rate=0     # relay restart

          ex=$(curl -s --max-time 12 -H "X-Auth: $RELAY_SECRET" "$RELAY/stats/exits" || echo '{}')
          st=$(curl -s --max-time 12 -H "X-Auth: $RELAY_SECRET" "$RELAY/stats"       || echo '{}')
          p_exits=$(echo "$ex" | jq -r "[.exits[]?|$SEL]|map(select(.mintPerMin>0))|length" 2>/dev/null || echo 0)
          queued=$(echo "$st"  | jq -r '.queued // "?"')
          oldest=$(echo "$st"  | jq -r 'if .oldestAgeMs then (.oldestAgeMs/1000|floor) else "?" end')

          ceiling="$CEILING_RATE"; [ -n "$GLOBAL_CEILING" ] && ceiling="$GLOBAL_CEILING"
          vg_rate="$rate"

          # EXCLUDE THIS RUN. A supervise_now tick is itself a workflow_dispatch,
          # so without this the supervisor counts ITSELF as a worker -- it
          # reported runners=1/3 with 0 attributable verdicts and sat in
          # "evaluating" instead of probing. The scheduled path never hit this
          # (its event is "schedule"), which is why the manual tick was worth running.
          inflight=$(gh run list -w "$WF" -L 100 --json status,event,databaseId \
            --jq "[.[]|select(.event==\"workflow_dispatch\" and (.status==\"in_progress\" or .status==\"queued\") and (.databaseId != ${GITHUB_RUN_ID}))]|length" 2>/dev/null || echo 0)
          case "$inflight" in ''|*[!0-9]*) inflight=0 ;; esac
          allq=$(gh run list -L 100 --json status --jq '[.[]|select(.status=="queued")]|length' 2>/dev/null || echo 0)
          case "$allq" in ''|*[!0-9]*) allq=0 ;; esac

          # ── RETIREMENT PASS ── runs BEFORE the add/shed decision, so the
          # counts the decision sees already reflect anything retired here.
          #
          # Per-runner attribution comes free from the relay: GitHub producers
          # tag each token `gh-<run id>|...`, so an exit maps back to the exact
          # run to cancel. This is what makes "retire in TOKENS MINTED" readable
          # rather than a wall-clock guess.
          retired=0
          if [ "${RETIRE_TOKENS:-0}" -gt 0 ] || [ "${MIN_ACCEPT_PCT:-0}" -gt 0 ]; then
            # OWNERSHIP GUARD -- load-bearing. The relay labels every GitHub
            # token `gh-<run id>`, but those runs belong to WHICHEVER lane
            # dispatched them. Without this, arming retirement would cancel
            # other lanes' runners mid-experiment. Retire only runs of THIS
            # workflow file.
            mine=$(gh run list -w "$WF" -L 100 --json databaseId,event               --jq '[.[]|select(.event=="workflow_dispatch")|.databaseId|tostring]|join(" ")' 2>/dev/null || echo "")
            echo "$ex" | jq -r '.exits[]? | select(.label != null)
                                | select(.label|startswith("gh-"))
                                | [(.label|split("|")[0]|ltrimstr("gh-")), .minted,
                                   (if ((.joined + .refused) > 0) then ((.joined * 100 / (.joined + .refused))|floor) else 0 end),
                                   (.joined + .refused)]
                                | @tsv' > /tmp/lanef_runners.tsv 2>/dev/null || : > /tmp/lanef_runners.tsv
            while IFS="$(printf '	')" read -r rid rmint racc rn; do
              [ -z "${rid:-}" ] && continue
              case "$rmint$racc$rn" in *[!0-9]*) continue ;; esac
              case " $mine " in
                *" $rid "*) ;;
                *) continue ;;                 # not ours -- never touch it
              esac
              why=""
              if [ "${RETIRE_TOKENS:-0}" -gt 0 ] && [ "$rmint" -ge "$RETIRE_TOKENS" ]; then
                why="spent its budget (${rmint} >= ${RETIRE_TOKENS} tokens)"
              elif [ "${MIN_ACCEPT_PCT:-0}" -gt 0 ] && [ "$rn" -ge "${MIN_ACCEPT_SAMPLES:-8}" ]                    && [ "$racc" -lt "$MIN_ACCEPT_PCT" ]; then
                # racc/rn come from cumulative joined+refused for THIS exit, not
                # from recentAcceptPct -- see the note by the state machine.
                # The healthy-looking-runner case: still minting fine, but its
                # tokens are being refused, so it is net-negative to the pool.
                why="acceptance decayed (${racc}% over ${rn} verdicts < ${MIN_ACCEPT_PCT}%)"
              fi
              if [ -n "$why" ]; then
                if [ "${RETIRE_DRY_RUN:-false}" = "true" ]; then
                  echo "RETIRE(dry-run) would cancel run $rid -- $why"
                else
                  echo "RETIRE run $rid -- $why"
                  gh run cancel "$rid" >/dev/null 2>&1 && retired=$(( retired + 1 ))                     || echo "  (cancel failed for $rid; next tick retries)"
                fi
              fi
            done < /tmp/lanef_runners.tsv
            rm -f /tmp/lanef_runners.tsv
            if [ "$retired" -gt 0 ]; then
              inflight=$(( inflight - retired )); [ "$inflight" -lt 0 ] && inflight=0
            fi
          fi

          # -- SCORE ACCEPTANCE FROM ATTRIBUTABLE VERDICTS ONLY --------------
          # NEVER use recentAcceptPct. It is a trailing window over verdicts
          # from EVERY consumer, so icebot results land in the same counter --
          # that is what made the VM anchor read 10% on 2026-07-29 while it was
          # in fact 12/12 JOINED from three separate redemption addresses. The
          # anchor never fell; its statistic did. Use per-exit verdicts, which
          # the relay attributes by token -> minting exit.
          #
          # WINDOWED, NOT CUMULATIVE (2026-07-30). This used lifetime
          # joined/refused, which never decays: an exit refused throughout one of
          # gartic's acceptance episodes banked those refusals forever, so a
          # runner that was fine again after the episode healed still scored
          # below ADMIT_PCT and got dropped. The relay now publishes
          # windowJoined/windowRefused over a 90-minute window
          # (SERVE_VERDICT_WINDOW_MIN); prefer them and fall back to the lifetime
          # fields so this still works against an older relay.
          mine=$(gh run list -w "$WF" -L 100 --json databaseId,event,status \
            --jq "[.[]|select(.event==\"workflow_dispatch\" and (.status==\"in_progress\" or .status==\"queued\") and (.databaseId != ${GITHUB_RUN_ID}))|.databaseId|tostring]|join(\" \")" 2>/dev/null || echo "")

          gh_j=0; gh_r=0
          for rid in $mine; do
            row=$(echo "$ex" | jq -r --arg id "gh-$rid" \
              '[.exits[]?|select(.label!=null)|select((.label|split("|")[0])==$id)]
               | ((map(.windowJoined  // .joined  // 0)|add // 0)|tostring) + " "
               + ((map(.windowRefused // .refused // 0)|add // 0)|tostring)' 2>/dev/null || echo "0 0")
            gh_j=$(( gh_j + ${row%% *} )); gh_r=$(( gh_r + ${row##* } ))
          done
          gh_n=$(( gh_j + gh_r ))
          gh_pct=0; [ "$gh_n" -gt 0 ] && gh_pct=$(( gh_j * 100 / gh_n ))

          # The anchor, from the same attributable source. It is the CONTROL:
          # if the VM is being refused too then the fault is the redemption
          # path or gartic itself, and GitHub must not be blamed or torn down.
          #
          # DISCOVER IT, DO NOT HARDCODE IT (2026-07-30). This used to match
          # `startswith("104.28.196.80")`. WARP reassigns its anycast IPv4 per
          # destination and rolls every few minutes, so whenever the VM moved off
          # that address vm_n went to 0, the `vm_n >= 4` guard below failed, and
          # the supervisor dropped GitHub to zero blaming it for the VM's own
          # rotation. The VM producers post NO label while every GitHub runner
          # posts `gh-<runid>`, so "unlabelled and currently minting" IS the
          # anchor -- and that is only reliable because the relay stopped making
          # labels sticky in the same change.
          vmrow=$(echo "$ex" | jq -r '[.exits[]?|select((.label // "")=="")|select((.mintPerMin // 0)>0)]
                                      | ((map(.windowJoined  // .joined  // 0)|add // 0)|tostring) + " "
                                      + ((map(.windowRefused // .refused // 0)|add // 0)|tostring)' 2>/dev/null || echo "0 0")
          vm_j=${vmrow%% *}; vm_r=${vmrow##* }
          vm_n=$(( vm_j + vm_r )); vm_pct=0
          [ "$vm_n" -gt 0 ] && vm_pct=$(( vm_j * 100 / vm_n ))

          # Cooldown after a refusal, derived from the last finished worker so
          # that no state has to be stored anywhere.
          cool=0
          # Only a REAL worker starts a cooldown. A supervise_now tick is also a
          # completed workflow_dispatch, and counting it put the lane into a
          # 25-minute cooldown nothing had earned. Workers run for minutes; a tick
          # finishes in ~60-90 s (it sleeps 60 s to measure a true rate), so filter
          # on duration.
          last_end=$(gh run list -w "$WF" -L 50 --json event,status,createdAt,updatedAt \
            --jq "[.[]|select(.event==\"workflow_dispatch\" and .status==\"completed\")|select(((.updatedAt|fromdateiso8601) - (.createdAt|fromdateiso8601)) > 240)]|sort_by(.updatedAt)|last|.updatedAt // empty" 2>/dev/null || echo "")
          if [ -n "$last_end" ]; then
            since=$(( $(date -u +%s) - $(date -u -d "$last_end" +%s 2>/dev/null || echo 0) ))
            [ "$since" -lt $(( RETRY_MIN * 60 )) ] && cool=$(( (RETRY_MIN * 60 - since + 59) / 60 ))
          fi

          # -- STATE MACHINE: opportunistic GitHub, dependable VM ------------
          action="hold"
          if [ "$STOP" = "1" ]; then
            action="killswitch"
          elif [ "$inflight" -eq 0 ]; then
            if [ "$cool" -gt 0 ]; then action="cooldown(${cool}m)"; else action="probe"; fi
          elif [ "$gh_n" -lt "${MIN_ACCEPT_SAMPLES:-8}" ]; then
            action="evaluating(${gh_n}/${MIN_ACCEPT_SAMPLES})"
          elif [ "$gh_pct" -ge "$ADMIT_PCT" ]; then
            if [ "$vg_rate" -ge "$ceiling" ]; then action="shed"
            elif [ "$inflight" -lt "$MAX_RUNNERS" ] && [ "$vg_rate" -lt "$FLOOR_RATE" ]; then
              action="scale"; [ "$allq" -ge 3 ] && action="hold(queue=$allq)"
            fi
          else
            if [ "$vm_n" -ge 4 ] && [ "$vm_pct" -lt "$ADMIT_PCT" ]; then
              action="hold(anchor ${vm_pct}% too - not github)"
            else
              action="drop-github"
            fi
          fi

          scope="$PROVIDER"; [ -n "$GLOBAL_CEILING" ] && scope="ALL-PROVIDERS"
          line="FLEET laneF enabled=$enabled action=$action | github ${gh_pct}% (${gh_j}j/${gh_r}r n=$gh_n) runners=$inflight/$MAX_RUNNERS retired=$retired | VM anchor ${vm_pct}% (${vm_j}j/${vm_r}r) | $scope TRUE rate=${vg_rate}/min (floor=$FLOOR_RATE target=$TARGET_RATE ceiling=$ceiling) | relay queued=$queued oldest=${oldest}s"
          echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"

          case "$action" in
            killswitch)  echo "FLEET_ENABLED=$enabled - dispatching nothing."; exit 0 ;;
            cooldown*)   echo "GitHub was refused recently; re-probing in ~${cool} min. The VM anchor carries the floor meanwhile."; exit 0 ;;
            evaluating*) echo "probe has ${gh_n} attributable verdicts; need ${MIN_ACCEPT_SAMPLES} before judging it."; exit 0 ;;
            hold*)       echo "no change."; exit 0 ;;
            drop-github)
              echo "GitHub at ${gh_pct}% over ${gh_n} verdicts while the VM anchor is ${vm_pct}% - dropping GitHub to ZERO."
              echo "  (correctness, not economy: newest-first serving means these tokens crowd the VM out of the queue)"
              for rid in $mine; do
                gh run cancel "$rid" >/dev/null 2>&1 && echo "  cancelled $rid" || echo "  cancel failed $rid"
              done
              echo "GitHub is now zero; re-probe after ${RETRY_MIN} min. The VM anchor is untouched."
              exit 0 ;;
            shed)
              victim=$(gh run list -w "$WF" -L 100 --json databaseId,status,event,createdAt \
                --jq '[.[]|select(.event=="workflow_dispatch" and .status=="in_progress")]|sort_by(.createdAt)|last|.databaseId' 2>/dev/null || echo "")
              if [ -n "$victim" ] && [ "$victim" != "null" ]; then
                echo "TRUE rate ${vg_rate} >= ceiling ${ceiling} - cancelling newest worker $victim"
                gh run cancel "$victim" || echo "cancel failed; next tick retries"
              fi
              exit 0 ;;
          esac

          # -- probe | scale : dispatch exactly one runner -------------------
          idx=$(( INDEX_BASE + inflight ))
          mins=$(( JOB_MINUTES - inflight * SPREAD_MIN - (RANDOM % 7) ))
          [ "$mins" -lt 20 ] && mins=20
          if gh workflow run "$WF" \
               -f chain=true -f egress="$PROVIDER" \
               -f vpngate_index="$idx" -f vpngate_stride="$STRIDE" \
               -f minutes="$mins" -f per_min=12 -f lanes=2 -f tunnels=1 \
               -f post_to_relay=true -f strip_dom=true; then
            if [ "$action" = "probe" ]; then
              echo "PROBE dispatched (index=$idx minutes=$mins) - ONE runner, scored on attributable verdicts before any scale-up."
            else
              echo "SCALE: github ${gh_pct}% accepted, rate ${vg_rate} < floor ${FLOOR_RATE} - added runner (index=$idx minutes=$mins), now $((inflight+1))/$MAX_RUNNERS"
            fi
          else
            echo "dispatch FAILED - next tick retries"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity — that would end 24/7 operation silently. One dated commit
      # keeps the repo "active". Uses CHAIN_PAT: a GITHUB_TOKEN commit does not
      # count, and also would not re-arm the schedule.
      - name: Heartbeat commit (keeps `schedule` from being auto-disabled)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          today=$(date -u +%Y-%m-%d)
          cur=$(gh api "repos/$GH_REPO/contents/.github/fleet-heartbeat" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
          sha=$(gh api "repos/$GH_REPO/contents/.github/fleet-heartbeat" --jq '.sha' 2>/dev/null || echo "")
          # Only write when the day actually changed — one commit per day, not one per tick.
          if [ "$(echo "$cur" | tr -d '[:space:]')" = "$today" ]; then
            echo "heartbeat already $today"; exit 0
          fi
          body=$(jq -n --arg m "chore: fleet heartbeat $today" \
                       --arg c "$(printf '%s' "$today" | base64 -w0)" \
                       --arg s "$sha" \
                       'if $s == "" then {message:$m, content:$c} else {message:$m, content:$c, sha:$s} end')
          echo "$body" | gh api -X PUT "repos/$GH_REPO/contents/.github/fleet-heartbeat" --input - -q '.commit.sha' \
            && echo "heartbeat -> $today" || echo "heartbeat write failed (non-fatal)"

  produce:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.supervise_now != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 358

    env:
      AUTH_SECRET: '74b163d6448f638bc82a6c5b9a6e64f1abd06e2bca6c47c148a041a5dc40f434'
      SITEKEY: '0x4AAAAAABBPKaIbNwnPEfSo'
      RELAY: 'https://mohanadino.duckdns.org:8443/add'
      SOCKS_PORT: '25344'

    steps:
      - name: 1. Runner facts (before any tunnel)
        run: |
          echo "direct_egress=$(curl -4 -s --max-time 15 https://api.ipify.org || echo unknown)"
          echo "asn=$(curl -s --max-time 15 https://ipinfo.io/org || echo unknown)"
          google-chrome --version || true
          chromium --version || true

      - name: 2. Install Xvfb + a browser that still honours --load-extension
        env:
          BROWSER: ${{ github.event.inputs.browser }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # xdotool drives the pointer through XTEST. Every runner challenge
          # escalates to interactive mode and then waits forever for a click
          # nobody makes -- see step 6's click driver.
          sudo apt-get install -y --no-install-recommends xvfb unzip xdotool

          if [ "${BROWSER:-playwright}" = "playwright" ]; then
            # A CURRENT Chromium. Branded Chrome removed --load-extension in
            # M137 outright, but Chromium only gates it behind a feature flag,
            # which step 6 turns off. Playwright is used purely as a download
            # channel here -- the browser is launched by us, with no CDP and no
            # driver attached, which is the whole point of this recipe.
            npx --yes playwright@latest install --with-deps chromium >/dev/null 2>&1 || \
              npx --yes playwright@latest install chromium
            BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            [ -n "$BIN" ] || { echo 'playwright chromium not found' >&2; exit 1; }
            echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
            "$BIN" --version
            exit 0
          fi

          # The runner's preinstalled Chrome is 150. Chrome REMOVED
          # --load-extension in M137 (and the
          # --disable-features=DisableLoadExtensionCommandLineSwitch escape
          # hatch with it), so on the stock browser the extension silently never
          # runs -- which is exactly how this failed on the first attempt.
          # Chrome for Testing 136 is the last line that still loads it, and
          # pinning is the same discipline the Camoufox v135 pin exists for.
          #
          # NOT the apt `chromium` package: on 24.04 that is a snap wrapper
          # whose confinement cannot read /tmp/ext.
          VER=$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r '[.versions[]
                      | select((.version | split(".")[0] | tonumber) == 136)
                      | select(any(.downloads.chrome[]?; .platform == "linux64"))
                      | .version] | last')
          [ -n "$VER" ] && [ "$VER" != "null" ] || { echo 'no Chrome-for-Testing 136 build found' >&2; exit 1; }
          echo "pinning Chrome for Testing $VER"
          curl -fsSL --retry 3 -o /tmp/cft.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$VER/linux64/chrome-linux64.zip"
          sudo unzip -q /tmp/cft.zip -d /opt
          sudo chmod -R a+rX /opt/chrome-linux64
          echo "CHROME_BIN=/opt/chrome-linux64/chrome" >> "$GITHUB_ENV"
          /opt/chrome-linux64/chrome --version

      - name: 3. Bring up N Cloudflare WARP tunnels, one exit IP each
        env:
          FORBID: ${{ github.event.inputs.forbid_exits }}
          TUNNELS: ${{ github.event.inputs.tunnels }}
          EGRESS: ${{ github.event.inputs.egress }}
          VPNGATE_INDEX: ${{ github.event.inputs.vpngate_index }}
          VPNGATE_STRIDE: ${{ github.event.inputs.vpngate_stride }}
          WEBSHARE_PROXY: ${{ github.event.inputs.webshare_proxy }}
        run: |
          # `set +e` explicitly: GitHub invokes every step as `bash -e {0}` and
          # `set -uo pipefail` does NOT clear that. One tunnel failing to
          # register must not kill a job that can still run on the others --
          # without this the failing warp_up.sh subshell aborts the step before
          # the "continuing with fewer" branch can even report why. Only zero
          # tunnels is fatal: falling through to the runner's own AS8075 egress
          # would mint nothing but 600010 for hours.
          set +e +o pipefail
          TUNNELS="${TUNNELS:-3}"
          EGRESS="${EGRESS:-warp}"
          : > /tmp/tunnels.txt

          # tunnels.txt is `n <proxy-url-or-dash> <exit-v4> <label>`. Field 2 is a
          # FULL proxy URL now (it used to be a bare SOCKS port), because vpngate
          # and direct take no proxy at all and webshare needs credentials.
          if [ "$EGRESS" != "warp" ]; then
            case "$EGRESS" in
              vpngate)
                sudo apt-get install -y --no-install-recommends openvpn >/dev/null 2>&1
                curl -fsSL -o /tmp/vpngate.csv https://www.vpngate.net/api/iphone/
                echo '' | base64 -d > /tmp/vpngate.py
                mkdir -p /tmp/vpn
                python3 /tmp/vpngate.py /tmp/vpngate.csv /tmp/vpn \
                  --index "${VPNGATE_INDEX:-0}" --stride "${VPNGATE_STRIDE:-1}" || true
                # A slice can come back empty (feed shorter than index*stride, or a
                # bad fetch). Retry once unsliced rather than dying: an empty
                # directory made `openvpn --config /tmp/vpn/*.ovpn` try to open the
                # literal glob and fail the whole job.
                if ! ls /tmp/vpn/*.ovpn >/dev/null 2>&1; then
                  echo "slice ${VPNGATE_INDEX}/${VPNGATE_STRIDE} was empty — retrying unsliced"
                  python3 /tmp/vpngate.py /tmp/vpngate.csv /tmp/vpn || true
                fi
                ls /tmp/vpn/*.ovpn >/dev/null 2>&1 || { echo "::error::vpngate produced no configs"; head -3 /tmp/vpngate.csv; exit 1; }
                echo "relay candidates: $(ls /tmp/vpn/*.ovpn | wc -l)"
                before=$(curl -4 -s --max-time 10 https://api.ipify.org)
                echo "egress_before=$before"
                ok=""
                for cfg in /tmp/vpn/*.ovpn; do
                  echo "--- trying $(basename "$cfg") ---"
                  sudo openvpn --config "$cfg" --daemon --log /tmp/ovpn.log \
                    --connect-timeout 15 --connect-retry-max 1 || continue
                  for i in $(seq 1 20); do
                    now=$(curl -4 -s --max-time 5 https://api.ipify.org || true)
                    if [ -n "$now" ] && [ "$now" != "$before" ]; then ok="$now"; break; fi
                    sleep 2
                  done
                  [ -n "$ok" ] && break
                  sudo pkill openvpn; sleep 2
                done
                [ -n "$ok" ] || { echo "::error::no VPN Gate relay came up"; tail -20 /tmp/ovpn.log; exit 1; }
                echo "vpn_egress=$ok"
                curl -s --max-time 15 "https://ipinfo.io/${ok}/json" | tr -d '\n'; echo
                # Default route IS the tunnel, so no --proxy-server.
                echo "0 - $ok vpngate" >> /tmp/tunnels.txt
                ;;
              webshare)
                IFS=':' read -r wh wp wu wpw <<< "$WEBSHARE_PROXY"
                [ -n "$wh" ] || { echo "::error::webshare_proxy required"; exit 1; }
                PURL="http://$wu:$wpw@$wh:$wp"
                ip=$(curl -4 -s --max-time 20 --proxy "$PURL" https://api.ipify.org)
                [ -n "$ip" ] || { echo "::error::webshare proxy unreachable"; exit 1; }
                echo "webshare_egress=$ip"
                echo "0 $PURL $ip webshare" >> /tmp/tunnels.txt
                ;;
              direct)
                ip=$(curl -4 -s --max-time 15 https://api.ipify.org)
                echo "direct_egress=$ip (expect Cloudflare 600010 on AS8075)"
                echo "0 - $ip direct" >> /tmp/tunnels.txt
                ;;
              *) echo "::error::unknown egress $EGRESS"; exit 1 ;;
            esac
            UP=$(wc -l < /tmp/tunnels.txt)
            echo "TUNNELS_UP=$UP" >> "$GITHUB_ENV"
            echo "EXITIP=$(awk 'NR==1{print $3}' /tmp/tunnels.txt)" >> "$GITHUB_ENV"
            echo "egress=$EGRESS up=$UP"
            exit 0
          fi

          mkdir -p /tmp/warp && cd /tmp/warp
          echo '' | base64 -d > warp_up.sh
          chmod +x warp_up.sh

          # Claimed exits are deliberately NOT added to the forbid list. WARP's
          # IPv4 is anycast and a runner pins to ONE: run 30347933726 rolled five
          # fresh registrations and drew 104.28.196.79 every time, only the IPv6
          # /64 varying, so a v4 forbid-list rejected every roll and gave 1
          # tunnel of 3. (The "five runs, five exits" pattern that suggested
          # otherwise was variance BETWEEN runners, not between registrations on
          # one runner.)
          #
          # Whether tunnels sharing a v4 still scale is the open question this
          # now measures: memory warp-netns-multiplies-token-exits recorded 3
          # WARP lanes at 106.6 tok/min on the VM, while
          # vm-chromium-producer/README.md asserts shared-exit lanes cannot
          # multiply the ceiling. If the limit keys on the WARP registration
          # (fresh every roll) they scale; if it keys on the v4 they will not --
          # and the per-instance rates in [result] say which, instead of leaving
          # it to inference.
          CLAIMED="${FORBID:-}"
          for n in $(seq 0 $(( TUNNELS - 1 ))); do
            d=/tmp/warp/$n; mkdir -p "$d"; cp -f /tmp/warp/warp_up.sh "$d/"
            # Reuse tunnel 0's downloads; the release CDN 504s in bursts and
            # there is no reason to pull the same two binaries N times.
            cp -f /tmp/warp/0/wgcf /tmp/warp/0/wireproxy "$d/" 2>/dev/null || true
            port=$(( SOCKS_PORT + n ))
            ( cd "$d" && WARP_FORBID_EXITS="$CLAIMED" WARP_MAX_ROLLS=10 ./warp_up.sh "$port" ) \
              > "$d/out.txt" 2>&1
            rc=$?
            v4=$(sed -n 's/^exit_v4=//p' "$d/out.txt" | tail -1)
            v6=$(sed -n 's/^exit_ip=//p'  "$d/out.txt" | tail -1)
            colo=$(sed -n 's/^colo=//p'   "$d/out.txt" | tail -1)
            if [ -n "$v4" ] && [ "$v4" != "none" ] && [ "$v4" != "FAILED" ]; then
              echo "$n socks5://127.0.0.1:$port $v4 ${colo:-unknown}" >> /tmp/tunnels.txt
              echo "tunnel $n  port=$port  exit=$v4  colo=${colo:-unknown}  v6=${v6:-none}"
            else
              echo "tunnel $n FAILED to register (rc=$rc) -- continuing with fewer"
              # Every roll line, so a failure says whether it was collisions with
              # the forbid list or registration flakiness.
              grep -aE '^roll=|^rolls_used=|^exit_|forbid|did not come up' "$d/out.txt" | tail -14
            fi
          done

          UP=$(wc -l < /tmp/tunnels.txt)
          echo "tunnels_up=$UP of $TUNNELS"
          [ "$UP" -ge 1 ] || { echo "::error::no WARP tunnel came up"; exit 1; }
          echo "TUNNELS_UP=$UP" >> "$GITHUB_ENV"
          echo "EXITIP=$(awk 'NR==1{print $3}' /tmp/tunnels.txt)" >> "$GITHUB_ENV"

      - name: 4a. Go toolchain (joinverify needs >= the version in its go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: 4. Build the join verifier
        run: |
          set -euo pipefail
          mkdir -p /tmp/jv && cd /tmp/jv
          echo '' | base64 -d | tar xzf -
          go build -o /tmp/joinverify .
          # A verifier that cannot answer REJECTED for an obviously bogus token
          # is measuring itself, not gartic.
          SELFPX=$(awk 'NR==1{print $2}' /tmp/tunnels.txt)
          if [ "$SELFPX" = "-" ] || [ -z "$SELFPX" ]; then
            /tmp/joinverify '1.AAAAAAAAAAAA.BBBBBBBB' \
              | sed 's/^/selftest(bogus token, expect REJECTED code=5): /'
          else
            /tmp/joinverify -proxy "$SELFPX" '1.AAAAAAAAAAAA.BBBBBBBB' \
              | sed 's/^/selftest(bogus token, expect REJECTED code=5): /'
          fi

      - name: 5. Write the MV3 extension
        env:
          LANES: ${{ github.event.inputs.lanes }}
          PER_MIN: ${{ github.event.inputs.per_min }}
          POST_TO_RELAY: ${{ github.event.inputs.post_to_relay }}
          STRIP_DOM: ${{ github.event.inputs.strip_dom }}
          ROTATE_FP: ${{ github.event.inputs.rotate_fp }}
          RECYCLE_MIN: ${{ github.event.inputs.recycle_min }}
          APPEARANCE: ${{ github.event.inputs.appearance }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ext
          cat > /tmp/ext/manifest.json <<'MANIFEST'
          {
            "manifest_version": 3,
            "name": "gartic token producer",
            "version": "1.0",
            "host_permissions": ["https://gartic.io/*", "https://mohanadino.duckdns.org/*"],
            "content_scripts": [{
              "matches": ["https://gartic.io/*"],
              "js": ["producer.js"],
              "run_at": "document_idle",
              "world": "MAIN"
            }]
          }
          MANIFEST

          # Runner variant of tunnel system/vm-chromium-producer/producer.js.
          # Two differences from the VM copy:
          #
          #   1. It emits the FULL token on a `TOKFULL` line so the job can
          #      verify acceptance. That line goes to the Chrome log file, which
          #      is never printed or uploaded -- the repo is public.
          #   2. It emits `CLICKAT lane=<i> x=<sx> y=<sy>` in SCREEN coordinates
          #      for any lane that is on screen and still unsolved, so step 6's
          #      xdotool driver can click the checkbox. On the runner every
          #      challenge escalates to interactive mode (BEFORE_INTERACTIVE on
          #      every build, AFTER_INTERACTIVE never, no `cf err`, no token,
          #      across three different WARP exits in three colos) -- the widget
          #      is not failing, it is waiting for a click. The VM never needed
          #      this because most of its challenges never escalate.
          #
          # Lanes are 320px apart, not 180: an interaction-only widget is ~300px
          # wide once it becomes visible, so the old spacing made them overlap
          # and put lane 1's checkbox underneath lane 0.
          cat > /tmp/ext/producer.js <<'PRODUCER'
          (function () {
            'use strict';
            var RELAY  = '__RELAY__';
            var SECRET = '__SECRET__';
            var KEY    = '__SITEKEY__';
            var LANES  = __LANES__;
            var PER_MIN = __PER_MIN__;
            var POST = __POST__;
            var STRIP = __STRIP__;
            var ROTATE_FP = __ROTATE__;
            var RECYCLE_MIN = __RECYCLE__;
            var APPEARANCE = '__APPEARANCE__';
            var LABEL = '__LABEL__';
            var GAP = Math.round(60000 / PER_MIN);
            var nextAllowed = 0, minted = 0, posted = 0;

            function log(){ console.log.apply(console, ['[producer]'].concat([].slice.call(arguments))); }

            // The POST goes through this browser's WARP tunnel, so the relay
            // sees the minting exit as the TCP peer and scores that exit
            // against icebot's real join verdicts (/stats/exits). LABEL is
            // only a convenience for mapping an exit back to a run -- the relay
            // never keys on it, because a producer could choose it.
            function post(tok) {
              if (!POST) { posted++; return; }
              fetch(RELAY, { method:'POST',
                headers:{'Content-Type':'application/json','X-Auth':SECRET},
                body: JSON.stringify({token: tok, label: LABEL})
              }).then(function(r){ if(r.ok){posted++;} log('posted', r.status, 'minted='+minted, 'posted='+posted); })
                .catch(function(e){ log('relay error', e && e.message); });
            }

            // Viewport point -> X11 screen point. outerHeight-innerHeight is the
            // browser chrome above the page; the horizontal term splits any
            // window border evenly. Self-correcting, so the window can sit
            // anywhere without the click driver needing to know where.
            //
            // devicePixelRatio is NOT optional: getBoundingClientRect() and
            // screenX are CSS pixels, while xdotool/XTEST address DEVICE pixels.
            // On a 175%-scaled display this error put the click ~1000px off the
            // widget -- which looks exactly like Cloudflare refusing us, the
            // same silent-failure shape that has already caused two multi-day
            // misdiagnoses here. Xvfb runs at 1x so the runner never saw it.
            function toScreen(r) {
              var dpr = window.devicePixelRatio || 1;
              var padX = Math.max(0, (window.outerWidth - window.innerWidth) / 2);
              var padY = Math.max(0, window.outerHeight - window.innerHeight);
              return { x: Math.round(((window.screenX || 0) + padX + r.left) * dpr),
                       y: Math.round(((window.screenY || 0) + padY + r.top) * dpr),
                       dpr: dpr };
            }

            function lane(i) {
              // ── 2026-07-29 FORK-BOMB FIX. Do not remove the generation guard.
              // recycle() used to be non-idempotent and unconditionally
              // scheduled a fresh build(). FIVE callbacks can fire for the same
              // widget generation (error-callback, timeout-callback, the poll
              // stuck-branch, the poll success-branch, build()'s own catch) and
              // a hung widget fires several at once -- so one lane forked into
              // two build chains, each installing its own callbacks and forking
              // again. `slot`/`id` are per-lane closures shared by every fork,
              // so removeChild() only dropped the newest div (every fork leaked
              // a live widget + iframe + renderer forever) and getResponse(id)
              // only read the newest fork, so MINTING STOPPED DEAD while
              // thousands of widgets churned. Measured on the VM: prod_* count
              // 2 -> 2,577 still climbing ~1.2/sec, `minted` frozen 39 minutes,
              // then a cgroup OOM at 3 GB. The whole time the process was alive
              // and burning 57% CPU. A generation counter makes every stale
              // callback a no-op, so exactly one rebuild follows each recycle.
              var gen = 0;
              var CAP = LANES * 3;              // hard ceiling on live widgets
              var slot, id, sawInter;
              function purge(sel) {
                var olds = document.querySelectorAll(sel);
                for (var k = 0; k < olds.length; k++) {
                  var wid = olds[k].getAttribute('data-wid');
                  if (wid) { try { window.turnstile.remove(wid); } catch (e) {} }
                  if (olds[k].parentNode) olds[k].parentNode.removeChild(olds[k]);
                }
                return olds.length;
              }
              function mine() { return 'div[id^="prod_' + i + '_"]'; }
              function build() {
                var myGen = gen;
                sawInter = false;
                purge(mine());
                var live = document.querySelectorAll('div[id^="prod_"]').length;
                if (live >= CAP) {
                  log('FORKBOMB cap=' + CAP + ' live=' + live + ' lane=' + i +
                      ' -- purging every lane and rebuilding');
                  purge('div[id^="prod_"]');
                }
                slot = document.createElement('div');
                slot.id = 'prod_' + i + '_' + myGen;
                // The class off-the-shelf Turnstile helpers look for. Our own
                // driver finds the widget by rect and does not need it, but a
                // bench measured stock helpers at 3/3 on a classed widget and
                // 0/2 on a bare div -- so this one line keeps any future
                // clicker (SeleniumBase's, or a CDP one) able to find us.
                slot.className = 'cf-turnstile';
                slot.style.cssText = 'position:fixed;left:' + (10 + i*320) + 'px;bottom:10px;z-index:2147483647';
                document.body.appendChild(slot);
                try {
                  id = window.turnstile.render(slot, {
                    sitekey: KEY, action: 'join', appearance: APPEARANCE,
                    callback: function(){},
                    'error-callback': function(c){ log('cf err', c); defer(myGen, 2000); },
                    'before-interactive-callback': function(){ sawInter = true; log('BEFORE_INTERACTIVE (lane '+i+')'); },
                    'after-interactive-callback': function(){ log('AFTER_INTERACTIVE (lane '+i+')'); },
                    'timeout-callback': function(){ defer(myGen, 0); }
                  });
                  slot.setAttribute('data-wid', String(id));
                } catch (e) { log('render threw', e && e.message); defer(myGen, 3000); return; }
                poll(0, myGen);
              }
              function read() {
                try { var t = window.turnstile.getResponse(id); if (t) return t; } catch(e){}
                var el = slot && slot.querySelector('input[name="cf-turnstile-response"]');
                return el && el.value ? el.value : null;
              }
              // Publish where this lane's checkbox is, in screen coordinates, so
              // the xdotool driver can hit it. Deliberately NOT tied to
              // before-interactive: a lane that is on screen and unsolved wants
              // a click whichever callback did or did not fire.
              function emitClick() {
                if (!slot) return;
                var r = slot.getBoundingClientRect();
                if (r.width < 20 || r.height < 20) return;   // still collapsed
                var p = toScreen(r);
                // The checkbox sits at the left end of an expanded widget; on a
                // small box aim at its centre instead.
                var ox = r.width >= 200 ? 30 : Math.round(r.width / 2);
                // Offsets are CSS pixels too, so they scale with the rest.
                var cx = p.x + Math.round(ox * p.dpr),
                    cy = p.y + Math.round((r.height / 2) * p.dpr);
                // An off-screen window yields absurd screen coords (a bench log
                // showed CLICKAT x=-18246 y=-17578). The pointer then lands
                // nowhere, the widget is never clicked, and the run looks
                // exactly like "Cloudflare refused us" -- a silent failure of
                // precisely the kind that has already cost this project two
                // multi-day misdiagnoses. Refuse to emit, and say why.
                // screen.width/height are CSS pixels as well -- compare like
                // with like, or the bounds check itself misfires on HiDPI.
                var sw = Math.round(((window.screen && window.screen.width)  || 1280) * p.dpr);
                var sh = Math.round(((window.screen && window.screen.height) || 900)  * p.dpr);
                if (cx < 0 || cy < 0 || cx > sw || cy > sh) {
                  log('CLICKOFFSCREEN lane=' + i + ' x=' + cx + ' y=' + cy +
                      ' screen=' + sw + 'x' + sh + ' dpr=' + p.dpr +
                      ' -- window is off-screen, not clicking');
                  return;
                }
                log('CLICKAT lane=' + i + ' x=' + cx + ' y=' + cy + ' dpr=' + p.dpr);
              }
              function poll(n, myGen) {
                if (myGen !== gen) return;      // a stale chain must die, not recycle
                var t = read();
                if (t) {
                  var now = Date.now();
                  var wait = Math.max(0, nextAllowed - now);
                  nextAllowed = Math.max(now, nextAllowed) + GAP;
                  minted++;
                  log('TOKEN lane'+i, 'len='+t.length, 'head='+t.slice(0,16), 'solve='+(sawInter?'int':'auto'));
                  log('TOKFULL ' + (sawInter ? 'int' : 'auto') + ' ' + t);
                  setTimeout(function(){ post(t); }, wait);
                  defer(myGen, wait + 500);
                  return;
                }
                if (n > 60) { defer(myGen, 0); return; }
                if (n % 5 === 2) emitClick();
                setTimeout(function(){ poll(n+1, myGen); }, 1000);
              }
              // defer()/recycle() are the ONLY route back to build(). Do not add
              // another caller -- that is exactly how the fork bomb happened.
              function defer(myGen, ms) {
                if (myGen !== gen) return;
                setTimeout(function(){ recycle(myGen); }, ms);
              }
              function recycle(myGen) {
                if (myGen !== gen) return;      // someone already recycled this gen
                gen++;                          // invalidates every pending callback
                try { window.turnstile.remove(id); } catch(e){}
                purge(mine());
                slot = null; id = null;
                setTimeout(build, 400);
              }
              return build;
            }

            // The old DIAG printed `iframes=0` for BOTH a minting VM and a dead
            // runner, so it decided nothing -- a top-level
            // `iframe[src*=challenges.cloudflare.com]` query misses an iframe
            // that Turnstile put inside a descendant's shadow root. Report each
            // lane's real size and iframe count, light DOM and shadow DOM, so a
            // zero-mint run says whether the widget drew at all.
            setInterval(function(){
              var ifr = document.querySelectorAll('iframe[src*="challenges.cloudflare.com"]').length;
              var boxes = document.querySelectorAll('[id^="prod_"]');
              var parts = [];
              for (var b = 0; b < boxes.length; b++) {
                var el = boxes[b], r = el.getBoundingClientRect();
                var kids = el.querySelectorAll('*'), sr = 0;
                for (var k = 0; k < kids.length; k++) {
                  if (kids[k].shadowRoot) sr += kids[k].shadowRoot.querySelectorAll('iframe').length;
                }
                parts.push(el.id + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) +
                           ' ifr=' + el.querySelectorAll('iframe').length + ' srIfr=' + sr +
                           ' resp=' + (el.querySelector('input[name="cf-turnstile-response"]') ? 1 : 0));
              }
              log('DIAG iframes=' + ifr + ' lanes=' + boxes.length + ' minted=' + minted +
                  ' posted=' + posted + ' | ' + parts.join(' | '));
            }, 20000);

            // gartic's homepage is a heavy Next.js app that animates
            // continuously, and on a runner the binding constraint is CPU: 3
            // tunnels and 5 tunnels both total 27/min, with per-instance rate
            // falling 9 -> 5 as instances are added. We need this origin (the
            // siteverify hostname must be gartic.io) and its window.turnstile
            // -- we do not need its UI. Dropping the DOM frees that CPU for
            // solving. window.turnstile is already captured and lives on, and
            // the lanes render into elements we create ourselves.
            // Re-roll the two vectors Camoufox actually varies. Measured across
            // 4 Camoufox launches: canvasHash 4/4 distinct, webglRenderer 4/4
            // distinct, while userAgent/platform/timezone stayed constant.
            // Noise is deliberately tiny -- flip the low bit of a handful of
            // pixels -- so the canvas still renders correctly and only its hash
            // moves. A heavy-handed spoof is itself a detection signal.
            function rotateFingerprint() {
              var seed = (Math.random() * 2147483647) | 0;
              function rnd(n) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; }

              try {
                var origToDataURL = HTMLCanvasElement.prototype.toDataURL;
                var origGetImageData = CanvasRenderingContext2D.prototype.getImageData;
                function perturb(d) {
                  var px = d.data.length >> 2;
                  for (var k = 0; k < 8 && px > 0; k++) {
                    var idx = rnd(px) << 2;
                    d.data[idx] = d.data[idx] ^ 1;
                  }
                  return d;
                }
                CanvasRenderingContext2D.prototype.getImageData = function () {
                  return perturb(origGetImageData.apply(this, arguments));
                };
                HTMLCanvasElement.prototype.toDataURL = function () {
                  try {
                    var c = this.getContext && this.getContext('2d');
                    if (c && this.width && this.height) {
                      c.putImageData(perturb(origGetImageData.call(c, 0, 0, this.width, this.height)), 0, 0);
                    }
                  } catch (e) {}
                  return origToDataURL.apply(this, arguments);
                };
              } catch (e) { log('fp canvas patch failed', e && e.message); }

              // 37445 = UNMASKED_VENDOR_WEBGL, 37446 = UNMASKED_RENDERER_WEBGL.
              var GPUS = [
                ['Google Inc. (Intel)',  'ANGLE (Intel, Intel(R) UHD Graphics 630 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Google Inc. (NVIDIA)', 'ANGLE (NVIDIA, NVIDIA GeForce GTX 1060 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Google Inc. (AMD)',    'ANGLE (AMD, AMD Radeon RX 580 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Intel Inc.',           'Intel Iris OpenGL Engine']
              ];
              var gpu = GPUS[rnd(GPUS.length)];
              try {
                [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (C) {
                  if (!C || !C.prototype) return;
                  var orig = C.prototype.getParameter;
                  C.prototype.getParameter = function (p) {
                    if (p === 37445) return gpu[0];
                    if (p === 37446) return gpu[1];
                    return orig.apply(this, arguments);
                  };
                });
              } catch (e) { log('fp webgl patch failed', e && e.message); }

              try {
                var cores = [2, 4, 8, 12, 16][rnd(5)];
                Object.defineProperty(navigator, 'hardwareConcurrency', { get: function () { return cores; } });
              } catch (e) {}

              log('FP rotated gpu=' + gpu[1].slice(0, 30));
            }

            function stripPage() {
              try {
                document.body.innerHTML = '';
                document.body.style.cssText = 'background:#202020;margin:0';
                if (document.title) document.title = 'p';
                log('page stripped for CPU');
              } catch (e) { log('strip failed', e && e.message); }
            }

            var waited = 0;
            (function wait() {
              if (window.turnstile && window.turnstile.render) {
                log('turnstile present -- starting', LANES, 'lanes');
                // Rotate BEFORE rendering any widget, or the challenge reads the
                // real canvas/WebGL and the rotation buys nothing.
                if (ROTATE_FP) rotateFingerprint();
                if (STRIP) stripPage();
                // A page reload re-runs this content script with a fresh seed,
                // i.e. a fresh identity, without paying to restart Chromium.
                if (RECYCLE_MIN > 0) {
                  setTimeout(function () {
                    log('RECYCLE reloading for a fresh identity');
                    location.reload();
                  }, RECYCLE_MIN * 60000);
                }
                for (var i = 0; i < LANES; i++) setTimeout(lane(i), i * 800);
                return;
              }
              if ((waited += 250) > 60000) { log('window.turnstile NEVER appeared'); return; }
              setTimeout(wait, 250);
            })();
          })();
          PRODUCER

          if [ "$POST_TO_RELAY" = "true" ]; then POSTJS=true; else POSTJS=false; fi
          if [ "${STRIP_DOM:-true}" = "true" ]; then STRIPJS=true; else STRIPJS=false; fi
          if [ "${ROTATE_FP:-false}" = "true" ]; then ROTJS=true; else ROTJS=false; fi
          RECJS="${RECYCLE_MIN:-0}"
          APPJS="${APPEARANCE:-interaction-only}"
          LABELJS="gh-${GITHUB_RUN_ID:-unknown}"
          sed -i "s|__RELAY__|$RELAY|; s|__SECRET__|$AUTH_SECRET|; s|__SITEKEY__|$SITEKEY|; s|__LANES__|$LANES|; s|__PER_MIN__|$PER_MIN|; s|__POST__|$POSTJS|; s|__STRIP__|$STRIPJS|; s|__ROTATE__|$ROTJS|; s|__RECYCLE__|$RECJS|; s|__APPEARANCE__|$APPJS|; s|__LABEL__|$LABELJS|" /tmp/ext/producer.js
          echo "rotate_fp=$ROTJS recycle_min=$RECJS"
          grep -c . /tmp/ext/producer.js

      - name: 6. Mint
        timeout-minutes: 350
        continue-on-error: true
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
          VERIFY_EVERY: ${{ github.event.inputs.verify_every }}
          CLICK_STYLE: ${{ github.event.inputs.click_style }}
          APPEARANCE: ${{ github.event.inputs.appearance }}
        run: |
          # GitHub invokes every step as `bash -e`, and `set -uo pipefail` does
          # NOT clear that. A monitoring loop must not be fatal: `grep -c`
          # exits 1 when the count is zero, so `MINTED=$(grep -ac ...)` killed
          # this step 30s in, before the first token had been minted.
          set +e +o pipefail
          MINUTES="${MINUTES:-300}"
          VERIFY_EVERY="${VERIFY_EVERY:-180}"
          CLICK_STYLE="${CLICK_STYLE:-human}"
          echo "click style: $CLICK_STYLE"
          mapfile -t TUNS < /tmp/tunnels.txt
          NINST=${#TUNS[@]}
          echo "starting $NINST producer instance(s) -- one browser per exit IP"

          # One Xvfb PER INSTANCE. Every browser then sits at 0,0 on its own
          # display, so the CLICKAT screen coordinates are identical but never
          # collide, and no window can occlude another instance's checkbox.
          for t in "${TUNS[@]}"; do
            set -- $t
            Xvfb ":$(( 97 + $1 ))" -screen 0 1280x900x24 -ac -nolisten tcp >/dev/null 2>&1 &
          done
          sleep 4

          # Plain browsers, no automation protocol. --proxy-server sends every
          # request (including the relay POST) through that instance's WARP
          # tunnel; Chromium resolves DNS remotely for socks5://, so nothing
          # leaks to the runner resolver. DisableLoadExtensionCommandLineSwitch:
          # Chrome >=137 ignores --load-extension without it.
          IDX=(); PIDS=(); PORTS=(); LOGS=()
          for t in "${TUNS[@]}"; do
            set -- $t; n=$1; purl=$2; v4=$3; colo=$4
            log="/tmp/chrome-$n.log"; : > "$log"; : > "/tmp/clicks-$n.log"
            # vpngate and direct move the DEFAULT ROUTE, so they take no
            # --proxy-server at all; warp and webshare pass a full proxy URL.
            pxarg=()
            [ "$purl" != "-" ] && pxarg=(--proxy-server="$purl")
            DISPLAY=":$(( 97 + n ))" "$CHROME_BIN" \
              --no-sandbox --disable-gpu --no-first-run --no-default-browser-check \
              --disable-dev-shm-usage \
              --user-data-dir="/tmp/chrome-profile-$n" \
              --window-position=0,0 --window-size=1280,880 \
              "${pxarg[@]}" \
              --disable-features=DisableLoadExtensionCommandLineSwitch \
              --disable-extensions-except=/tmp/ext \
              --load-extension=/tmp/ext \
              --enable-logging=stderr --v=0 \
              "https://gartic.io/" >> "$log" 2>&1 &
            IDX+=("$n"); PIDS+=($!); PORTS+=("$purl"); LOGS+=("$log")
            echo "instance $n -> display :$(( 97 + n ))  proxy ${purl}  exit $v4 ($colo)"
          done

          # Fail loudly only if NO instance ran the extension -- that is a
          # different bug from "the challenge did not solve", and conflating the
          # two is what cost an earlier session its diagnosis.
          for _ in $(seq 1 24); do
            up=0
            for l in "${LOGS[@]}"; do grep -aq '\[producer\]' "$l" && up=$(( up + 1 )); done
            [ "$up" -eq "$NINST" ] && break
            sleep 5
          done
          up=0; for l in "${LOGS[@]}"; do grep -aq '\[producer\]' "$l" && up=$(( up + 1 )); done
          if [ "$up" -eq 0 ]; then
            echo "::error::extension never executed -- --load-extension was ignored or the page never loaded"
            echo "--- chrome version ---"; "$CHROME_BIN" --version
            echo "--- last 40 log lines ---"; tail -40 "${LOGS[0]}"
            exit 1
          fi
          echo "extension is running in $up/$NINST instance(s)"

          # --- click driver, one per instance ----------------------------------
          # Every challenge on a runner escalates to interactive mode and then
          # waits for a click that a browser nobody is driving never makes.
          # xdotool goes through XTEST, so Chromium receives genuine input
          # (isTrusted=true) -- unlike a CDP-dispatched event, which is exactly
          # what this whole no-automation-protocol recipe exists to avoid.
          # Positions come from the extension's CLICKAT lines (screen coords),
          # so nothing here has to guess where the widget is.
          # A synthetic click is not automatically as good as a human one. The
          # operator watched a hand click succeed on a widget where the machine
          # click failed, so the pointer path itself may be scored. `simple` is
          # the original 3-hop teleport, kept so the two can be A/B'd.
          simple_click() {
            local x="$1" y="$2"
            xdotool mousemove --sync $(( x - 40 )) $(( y - 25 )) sleep 0.12 \
                    mousemove --sync $(( x - 12 )) $(( y - 6 ))  sleep 0.09 \
                    mousemove --sync "$x" "$y" sleep 0.18 click 1 >/dev/null 2>&1
          }
          human_click() {
            local tx="$1" ty="$2" args hold
            # Approach from a random angle and distance so no two clicks trace
            # the same path; ease-in-out cubic, per-step jitter, and a slight
            # overshoot that is then corrected -- humans do not land exactly.
            # bash has no floats, so awk computes the path.
            args=$(awk -v tx="$tx" -v ty="$ty" -v seed="$RANDOM$idx" '
              BEGIN{
                srand(seed); pi=3.14159265;
                ang = rand()*360; dist = 80 + rand()*140; steps = 14 + int(rand()*8);
                sx = tx + dist*cos(ang*pi/180); sy = ty + dist*sin(ang*pi/180);
                # Keep the approach origin on-screen (Xvfb is 1280x900).
                # xdotool clamps out-of-range coords, which would start the
                # path pinned against a screen edge -- the opposite of subtle.
                if (sx < 5) sx = 5; if (sx > 1275) sx = 1275;
                if (sy < 5) sy = 5; if (sy > 895) sy = 895;
                ox = tx + (rand()*8-4); oy = ty + (rand()*6-3);
                for (i=1; i<=steps; i++) {
                  t = i/steps;
                  e = (t<0.5) ? 4*t*t*t : 1-((-2*t+2)^3)/2;
                  printf "mousemove --sync %d %d sleep %.3f ",
                         sx+(ox-sx)*e + (rand()*2.4-1.2),
                         sy+(oy-sy)*e + (rand()*2.4-1.2),
                         0.008+rand()*0.022;
                }
                printf "mousemove --sync %d %d sleep %.3f ", tx, ty, 0.09+rand()*0.14;
              }')
            # Humans hold the button ~60-140ms; xdotool `click` is about 12ms.
            hold=$(awk -v s="$RANDOM" 'BEGIN{srand(s); printf "%.3f", 0.06+rand()*0.08}')
            xdotool $args mousedown 1 >/dev/null 2>&1
            sleep "$hold"
            xdotool mouseup 1 >/dev/null 2>&1
          }

          click_driver() {
            local idx="$1" log="/tmp/chrome-$1.log" last=0 total
            export DISPLAY=":$(( 97 + idx ))"
            while :; do
              sleep 4
              total=$(wc -c < "$log" 2>/dev/null || echo 0)
              [ "${total:-0}" -le "$last" ] && continue
              tail -c +$(( last + 1 )) "$log" 2>/dev/null \
                | grep -ao 'CLICKAT lane=[0-9]* x=-\?[0-9]* y=-\?[0-9]*' \
                | awk '{print $2, $3, $4}' | sed 's/[a-z]*=//g' | sort -u -k1,1 \
                | while read -r ln x y; do
                    [ -n "$x" ] && [ -n "$y" ] || continue
                    if [ "$CLICK_STYLE" = "simple" ]; then
                      simple_click "$x" "$y"
                    else
                      human_click "$x" "$y"
                    fi
                    echo "[click] inst=$idx lane=$ln at $x,$y" >> "/tmp/clicks-$idx.log"
                  done
              last=$total
            done
          }
          # A self-solving widget must not be clicked -- interfering with a
          # challenge that is already completing only breaks it.
          CLICKERS=()
          if [ "${APPEARANCE:-interaction-only}" = "interaction-only" ]; then
            for n in "${IDX[@]}"; do click_driver "$n" & CLICKERS+=($!); done
          else
            echo "appearance=${APPEARANCE} -- click driver disabled (widget self-solves)"
          fi

          sum_over() {   # $1 = grep pattern, counted across every instance log
            local s=0 c
            for l in "${LOGS[@]}"; do c=$(grep -ac "$1" "$l" 2>/dev/null); s=$(( s + ${c:-0} )); done
            echo "$s"
          }

          END=$(( $(date +%s) + MINUTES * 60 ))
          verified=0; accepted=0; lastcheck=0; vturn=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30
            alive=0
            for p in "${PIDS[@]}"; do kill -0 "$p" 2>/dev/null && alive=$(( alive + 1 )); done
            [ "$alive" -eq 0 ] && { echo "all chrome instances exited"; break; }

            # grep -c always prints a number but exits 1 on no match, so a
            # `|| echo 0` fallback would capture "0\n0" and break the arithmetic.
            MINTED=$(sum_over 'TOKFULL ')
            CLICKS=$(cat /tmp/clicks-*.log 2>/dev/null | grep -ac '^\[click\]'); CLICKS=${CLICKS:-0}
            NOW=$(date +%s); EL=$(( NOW - (END - MINUTES*60) ))
            RATE=$(( EL > 0 ? MINTED * 60 / EL : 0 ))
            echo "[summary] t=${EL}s minted=$MINTED rate=${RATE}/min clicks=$CLICKS alive=$alive/$NINST accepted=$accepted/$verified"

            # Verify one fresh token every ~3 min, ROTATING instances so every
            # exit gets checked. Tokens are single-use, so a verified one is
            # spent -- keep this sparse. Never print the token.
            if [ $(( NOW - lastcheck )) -ge "$VERIFY_EVERY" ] && [ "$MINTED" -gt 0 ]; then
              lastcheck=$NOW
              vi=$(( vturn % NINST )); vturn=$(( vturn + 1 ))
              vlog="${LOGS[$vi]}"; vport="${PORTS[$vi]}"; vn="${IDX[$vi]}"
              # Chrome's console log appends `", source: <url> (line)` to EVERY
              # line. The old extraction was `tr -d '"'`, which deletes the quote
              # characters but leaves that suffix glued onto the token -- so the
              # verifier was replaying a corrupted string, and a corrupted token
              # can only ever come back code=5. Cut at the first quote instead:
              # the token alphabet is base64url plus dots, so it never contains
              # one. This is why a 143-token run reported accepted=0/4.
              LINE=$(grep -a 'TOKFULL ' "$vlog" | tail -1 | sed 's/.*TOKFULL //' | sed 's/".*$//' | tr -d '\r')
              FLAG=${LINE%% *}; TOK=${LINE#* }
              if [ -n "$TOK" ] && [ "$TOK" != "$LINE" ]; then
                # ⚠️ SAME-PATH BLIND -- this number is a MINT sanity check, not
                # an acceptance measurement. Redeeming through the tunnel that
                # minted the token means an exit being rate-limited for
                # over-production still passes its own replay: on 2026-07-28
                # this line printed 54/59 ACCEPTED while icebot, redeeming the
                # same queue from Webshare proxies, was refused 100% code 5 and
                # production was down.
                # Real acceptance, per minting exit:
                #   https://mohanadino.duckdns.org:8443/stats/exits
                if [ "$vport" = "-" ]; then V=$(/tmp/joinverify "$TOK" 2>&1 | tail -1)
                else V=$(/tmp/joinverify -proxy "$vport" "$TOK" 2>&1 | tail -1); fi
                verified=$(( verified + 1 ))
                case "$V" in JOINED*) accepted=$(( accepted + 1 ));; esac
                # solve=int means this token came from a challenge that escalated
                # to interactive and was clicked; solve=auto means it solved by
                # itself.
                echo "[verify] inst=$vn solve=$FLAG len=${#TOK} $V   (running $accepted/$verified ACCEPTED)"
              fi
            fi
          done

          for c in "${CLICKERS[@]}"; do kill "$c" 2>/dev/null; done
          MINTED=$(sum_over 'TOKFULL ')
          CLICKS=$(cat /tmp/clicks-*.log 2>/dev/null | grep -ac '^\[click\]'); CLICKS=${CLICKS:-0}
          EL=$(( $(date +%s) - (END - MINUTES*60) )); [ "$EL" -lt 1 ] && EL=1
          echo "=============================================="
          echo "[result] instances=$NINST minted=$MINTED rate=$(( MINTED * 60 / EL ))/min clicks=$CLICKS same-path-replay=$accepted/$verified (NOT acceptance -- see /stats/exits)"
          echo "=============================================="
          echo "--- per instance ---"
          for t in "${TUNS[@]}"; do
            set -- $t; n=$1; v4=$3; colo=$4
            m=$(grep -ac 'TOKFULL ' "/tmp/chrome-$n.log" 2>/dev/null); m=${m:-0}
            echo "inst $n  exit=$v4 ($colo)  minted=$m  rate=$(( m * 60 / EL ))/min"
          done
          # If the per-instance rates hold up while this says 1, the ceiling
          # keys on the WARP registration, not the exit address -- and shared-v4
          # lanes are a legitimate way to scale one runner.
          echo "distinct exit v4s: $(awk '{print $3}' /tmp/tunnels.txt | sort -u | wc -l) across $NINST instance(s)"
          echo "--- interactive-mode callbacks ---"
          for pat in BEFORE_INTERACTIVE AFTER_INTERACTIVE; do
            echo "$pat: $(sum_over "$pat")"
          done
          echo "--- tokens by solve path ---"
          for pat in int auto; do
            echo "solve=$pat: $(sum_over "TOKFULL $pat ")"
          done
          cat "${LOGS[@]}" 2>/dev/null | grep -a 'cf err' | sed 's/.*cf err/cf err/' | sort | uniq -c | sort -rn | head
          if [ "$MINTED" -eq 0 ]; then
            # The producer's own console lines live in the chrome logs and were
            # previously never surfaced, so a zero-mint run showed nothing to
            # diagnose -- not even whether window.turnstile appeared. Dump them
            # (never a TOKFULL line; the repo is public).
            echo "--- producer console (deduped) ---"
            cat "${LOGS[@]}" 2>/dev/null | grep -a 'producer\]' | grep -av 'TOKFULL' \
              | sed 's/.*\[producer\]/[producer]/' \
              | sed 's/len=[0-9]* head=.*/len=... head=.../' \
              | sort | uniq -c | sort -rn | head -20
              echo "--- off-screen click refusals (window mispositioned) ---"
            sum_over 'CLICKOFFSCREEN'
            echo "--- clicks issued ---"; cat /tmp/clicks-*.log 2>/dev/null | tail -5
            echo "::error::minted 0. Read it off the counters above: clicks=0 means the widget never became clickable (CLICKAT never fired -- lane stayed collapsed); clicks>0 with BEFORE_INTERACTIVE>0 and AFTER_INTERACTIVE=0 means the click landed but Cloudflare still refused this browser/exit."
          fi

          # Explicit teardown, AFTER the result is printed. Leaving the browsers,
          # displays and tunnels to the runner's own orphan reaper wedged run
          # 30353621246 in post-job cleanup for 28+ minutes on a 12-minute job --
          # and the logs of a run that has to be cancelled are truncated, so the
          # measurement is lost outright. A hung job also holds a concurrency
          # slot, which the ~6-12 min runner drip-feed makes expensive.
          echo "tearing down $NINST instance(s)"
          for p in "${PIDS[@]}"; do kill "$p" 2>/dev/null; done
          sleep 2
          for p in "${PIDS[@]}"; do kill -9 "$p" 2>/dev/null; done
          pkill -f 'Xvfb :9' 2>/dev/null
          pkill -f 'wireproxy -c' 2>/dev/null
          echo "teardown done"
          exit 0

      # ── 7. FAST-PATH successor. The scheduled supervisor is the authority and
      # will converge the fleet on its own; this only removes the up-to-one-tick
      # delay. It is deliberately safe to no-op.
      #
      # THE BUG THIS REPLACES: the original ran
      #   gh workflow run gartic-chromium-warp.yml -f chain=true
      # which passes ONLY `chain`, so the successor reverted every other input to
      # its default — a VPN Gate worker chained into a WARP successor (the
      # default egress), i.e. into the 4%-acceptance configuration, with a
      # different vpngate_index, per_min and minutes as well. Generation 2 of any
      # chain was therefore silently misconfigured. We now forward the ENTIRE
      # input set verbatim via the API, so a successor is a faithful clone and
      # the staggered `minutes` assigned at fill time persists down the chain.
      #
      # `!cancelled()` not `always()`: success and failure both replenish, but an
      # operator cancelling a run means "stop this one". Eviction (where this
      # step never runs at all) is exactly what the supervisor exists to cover.
      - name: 7. Dispatch successor (fast path; supervisor is the authority)
        if: ${{ !cancelled() && github.event.inputs.chain == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
          GH_REPO: ${{ github.repository }}
          WF: gartic-lane-f-chain.yml
          REF: ${{ github.ref_name }}
          ALL_INPUTS: ${{ toJSON(github.event.inputs) }}
          ENABLED_CTX: ${{ vars.FLEET_ENABLED }}
          RELAY: https://mohanadino.duckdns.org:8443
          RELAY_SECRET: 74b163d6448f638bc82a6c5b9a6e64f1abd06e2bca6c47c148a041a5dc40f434
          PROVIDER: "warp"
          CEILING_RATE: "55"
          MAX_RUNNERS: "3"
        run: |
          set -uo pipefail

          # Read the switch LIVE, not from the `vars` context: that is resolved
          # when the JOB STARTS, so a run already in flight carries the stale
          # value and the kill switch looks ignored for a whole generation.
          # Measured: switch set 15:03:23Z, a successor still went out 15:06:57Z
          # from a job that had started at 15:00:47Z.
          # See the supervisor's note: the `vars` context is authoritative and
          # lag-bound; a live API read is used ONLY when it returns a clean
          # literal, because CHAIN_PAT 403s with a JSON body on stdout and an
          # `|| echo 1` fallback turns that into "enabled" and defeats the
          # switch entirely.
          enabled="${ENABLED_CTX:-1}"
          live=$(gh api "repos/$GH_REPO/actions/variables/FLEET_ENABLED" --jq '.value' 2>/dev/null || true)
          case "$live" in 0|1|true|false|no|off|yes|on|TRUE|FALSE) enabled="$live" ;; esac
          case "$(echo "$enabled" | tr 'A-Z' 'a-z')" in
            0|false|no|off)
              echo "KILL SWITCH: FLEET_ENABLED=$enabled — not dispatching a successor."
              exit 0 ;;
          esac

          # Never chain past the provider's acceptance cliff. Above ~90 tok/min
          # VPN Gate acceptance goes to zero, and refused tokens crowd out good
          # ones because the relay serves newest-first. The supervisor sheds;
          # this just declines to make it worse.
          # TRUE rate, two samples 60 s apart -- never mintPerMin, which inflated
          # 1.5-1.95x because reading the endpoint corrupted its own state.
          case "$PROVIDER" in
            warp)    SEL='select(.src|startswith("104.28."))' ;;
            vpngate) SEL='select((.src|startswith("104.28."))|not)' ;;
            *)       SEL='select(.)' ;;
          esac
          snap() { curl -s --max-time 12 -H "X-Auth: $RELAY_SECRET" "$RELAY/stats/exits" \
                   | jq -r "[.exits[]?|$SEL|.minted]|add // 0" 2>/dev/null || echo 0; }
          m0=$(snap); sleep 60; m1=$(snap)
          case "$m0" in ''|*[!0-9]*) m0=0 ;; esac
          case "$m1" in ''|*[!0-9]*) m1=0 ;; esac
          rate=$(( m1 - m0 )); [ "$rate" -lt 0 ] && rate=0
          if [ "$rate" -ge "$CEILING_RATE" ]; then
            echo "$PROVIDER TRUE rate ${rate}/min >= ceiling ${CEILING_RATE} -- not dispatching a successor."
            exit 0
          fi

          # Do not replace myself if the fleet is already full without me.
          # Counting workers only (this file also runs as the supervisor) and
          # excluding this very run, which is still in_progress right now.
          inflight=$(gh run list -w "$WF" -L 100 --json status,event,databaseId \
            --jq "[.[]|select(.event==\"workflow_dispatch\" and (.status==\"in_progress\" or .status==\"queued\") and (.databaseId != ${GITHUB_RUN_ID}))]|length" 2>/dev/null || echo 0)
          case "$inflight" in ''|*[!0-9]*) inflight=0 ;; esac
          if [ "$inflight" -ge "$MAX_RUNNERS" ]; then
            echo "fleet already at MAX_RUNNERS ($inflight/$MAX_RUNNERS) without me — not dispatching."
            exit 0
          fi

          body=$(jq -n --arg ref "$REF" --argjson inputs "$ALL_INPUTS" '{ref:$ref, inputs:$inputs}')
          for attempt in 1 2 3 4 5; do
            if echo "$body" | gh api -X POST \
                 "repos/$GH_REPO/actions/workflows/$WF/dispatches" --input - ; then
              echo "successor dispatched on attempt $attempt (inputs forwarded verbatim)"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "all dispatch attempts failed — the supervisor will refill within a tick"
          exit 0
