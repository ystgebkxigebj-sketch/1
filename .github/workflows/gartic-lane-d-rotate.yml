name: Gartic producer LANE D (exit rotation)

# Replaces the Camoufox producer fleet, which cannot mint any more:
#
#   1. Its egress is AS8075 Microsoft, which Cloudflare refuses the challenge to
#      (measured 2026-07-24: direct 0 tokens / 93x 600010, WARP 238, VPN Gate 99).
#   2. Its embedded generator renders WITHOUT `action:'join'`, and gartic
#      validates that field server-side -- every such token is refused code 5.
#   3. It pins `camoufox==0.4.11` but `camoufox fetch` now pulls v152, which
#      yields zero tokens.
#
# This workflow is the GitHub port of the recipe that is live and minting on the
# Oracle VM (`tunnel system/vm-chromium-producer/`): a PLAIN Chromium with no
# automation protocol attached, doing the work from an MV3 content script in the
# MAIN world, egressing through an anonymous Cloudflare WARP registration.
#
# On the diagnostic signature that misled the previous session: a healthy
# producer logs `DIAG iframes=0` and fires `before-interactive`. That is what
# `appearance:'interaction-only'` looks like, NOT a failure -- the live VM
# producer prints exactly that while minting. Do not treat it as a verdict.
# The only verdict that counts is the ACCEPTED ratio this workflow prints.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to mint for"
        required: false
        default: "300"
      lanes:
        description: "Parallel Turnstile widgets (2 is the measured optimum)"
        required: false
        default: "2"
      per_min:
        description: "Per-IP mint cap. Above ~12-14 gartic refuses everything."
        required: false
        default: "12"
      post_to_relay:
        description: "POST minted tokens to the relay (false = verify only)"
        required: false
        default: "true"
      chain:
        description: "Dispatch a successor when this run ends"
        required: false
        default: "false"
      forbid_exits:
        # Empty by DEFAULT and it must stay that way. WARP's IPv4 is anycast --
        # every lane shares one address (the VM's lanes all sit on
        # 104.28.196.79) and only the IPv6 /64 actually differs. Seeding this
        # with a v4 makes warp_up.sh reject every roll and fail the job: an
        # earlier run burned all 4 rolls on 104.28.196.79/IAD for exactly that
        # reason. Put a v6 prefix here if a real collision needs excluding.
        description: "WARP exits to refuse. Use IPv6 prefixes -- the v4 is anycast and always collides."
        required: false
        default: ""
      appearance:
        # We copied appearance:'interaction-only' from gartic's own client, but
        # we are not gartic's client -- we only need tokens that pass siteverify
        # with action:'join'. How the widget LOOKS is our choice, and this mode
        # is expensive: it stays invisible until Cloudflare demands interaction,
        # which on a datacenter IP is EVERY time (measured: 100% solve=int on
        # runners). Every solve then costs a click and is scrutinised, capping
        # an exit near 12 tok/min.
        #
        # The year-old Camoufox generator set NO appearance -- the default
        # managed widget, which auto-solves with no click -- and sustained
        # ~47 tok/min per IP, 4x what we get. That is the workaround this input
        # exists to test. ('always' renders the widget visibly and lets it
        # self-solve; the click driver is skipped in that mode, since clicking a
        # widget that is already solving only interferes.)
        description: "interaction-only (invisible, needs a click) or always (visible, self-solving)"
        required: false
        default: "interaction-only"
      rotate_fp:
        # The operator's experience, from running this a year ago: a single
        # browser instance decays after a while and its tokens stop being
        # accepted even though Cloudflare keeps issuing them -- and Camoufox was
        # the only thing that fixed it. A bench confirmed the mechanism is real:
        # across 4 Camoufox launches, canvasHash and webglRenderer differed
        # EVERY time while userAgent/platform/timezone stayed constant. So it
        # re-rolls precisely the high-entropy vectors.
        # Chromium never re-rolls anything, and --user-agent/--window-size/--lang
        # CANNOT reach canvas or WebGL, which is why this lives in the extension
        # rather than in flags.
        #
        # ⚠️ MEASURED AND IT DOES NOT WORK. Controlled local A/B, same IP, same
        # 10-minute window, control run LAST (so most depleted):
        #     canvas + WebGL + cores spoof -> 0 minted
        #     canvas noise alone           -> 0 minted
        #     no rotation (control)        -> 20 minted, 4/4 accepted, no cf err
        # Cloudflare detects a JS-level canvas patch and simply stops issuing --
        # not "issues tokens gartic then refuses", but no tokens at all. You
        # cannot fake this from inside the page: any override is visible to the
        # same JS that reads it. Camoufox patches at the C++/Gecko level, which
        # is exactly why it can rotate identity and this cannot.
        # KEEP THIS false. It is retained only to document the negative.
        description: "BROKEN - JS canvas/WebGL spoofing stops Cloudflare issuing entirely. Keep false."
        required: false
        default: "false"
      recycle_min:
        # Rotation only helps if it actually happens again. Reloading the page
        # re-runs the content script with a fresh seed, which is far cheaper
        # than restarting Chromium and loses only the in-flight widgets.
        description: "Reload each page every N minutes to draw a fresh identity (0 = never)"
        required: false
        default: "0"
      click_style:
        # The operator observed, on a degraded IP, that a HAND click on the
        # checkbox succeeded where the synthetic one did not. Cloudflare can
        # hand back a token client-side and still fail it at siteverify if it
        # judged the interaction fraudulent -- which looks exactly like our
        # symptom: getResponse() returns a full-length token (mint counter
        # rises) and gartic then refuses it code=5. So click realism may affect
        # ACCEPTANCE, not just whether a token appears.
        # MEASURED A/B, 3 tunnels, ~20 min apart on rested exits:
        #   simple -> 364 minted, 29/min, 12/12 accepted, 401 clicks
        #   human  -> 193 minted, 16/min, 10/11 accepted, 217 clicks
        # Realism bought nothing on a rested exit and cost 45% of production:
        # each human click issues 20+ synced mousemoves plus an awk spawn, so
        # the driver lands about half as many clicks per cycle and tokens track
        # clicks nearly 1:1. Depletion does not explain it (cumulative ~557 here
        # vs ~2000 when decay set in). Default back to `simple`; `human` stays
        # for the untested case that matters -- whether it extends the budget on
        # a DEPLETED exit, which is where the operator saw a hand click succeed
        # and a synthetic one fail.
        description: "simple (3-hop teleport, faster) or human (eased path, jitter, press-hold)"
        required: false
        default: "simple"
      verify_every:
        # Seconds between acceptance checks. 180 gives only ~4 samples in a
        # 12-minute run, which cannot separate a real acceptance drop from
        # noise -- 4 tunnels scored 2/4 against 3 tunnels' 4/4 and that is not
        # a decidable difference. Each check spends one token (they are
        # single-use), which at 30+/min is under 2% of production.
        description: "Seconds between acceptance checks. Lower = more samples, costs one token each."
        required: false
        default: "180"
      strip_dom:
        # Throughput on a runner is CPU-bound (3 and 5 tunnels both total
        # 27/min), and most of that CPU is gartic's animated Next.js homepage,
        # not Turnstile. We need the origin and window.turnstile, not the UI.
        description: "Drop gartic's DOM once turnstile is captured, to free CPU for solving"
        required: false
        default: "true"
      tunnels:
        # ⚠️ RETRACTED 2026-07-29: the "43/58 and 54/59 accepted" figures below
        # were produced by THIS WORKFLOW'S OWN VERIFIER, which replays each
        # token through the WARP tunnel that minted it. A token from an
        # over-driven exit still passes when redeemed from that same exit, so
        # the instrument was blind to the exact failure it was measuring. It
        # reported 54/59 accepted while icebot was refused 100% code 5 and
        # production was down for an hour.
        #
        # RE-MEASURED with icebot's real joins as ground truth:
        #   1 tunnel  (~11/min per exit) -> 53 joins /    3 code-5  ✅
        #   3 tunnels (~33/min, ONE IP)  -> 27 joins /  175 code-5  ❌ 86% fail
        #   6 tunnels x 20 workers       ->  0 joins / 1041 code-5  ❌ outage
        #
        # WARP's IPv4 is anycast: 5 fresh registrations on one runner all drew
        # 104.28.196.79. So N tunnels is NOT N exits, it is N times the traffic
        # on ONE address, and gartic rate-limits acceptance per solving IP at
        # roughly 12 accepted tok/min. The "quota keys on storage identity"
        # claim is withdrawn -- those 6 tunnels were 6 separate browsers with 6
        # separate --user-data-dirs, i.e. six distinct storage identities, and
        # they still collapsed.
        #
        # Scale by adding EXITS (more runners at 1 tunnel), not tunnels. Verify
        # per exit at https://mohanadino.duckdns.org:8443/stats/exits, which
        # scores each minting IP against icebot's real join verdicts.
        description: "Browsers per runner. WARP's v4 is anycast so these SHARE one exit -- above 1 you are just overdriving it."
        required: false
        default: "1"
      egress:
        # WHY THIS EXISTS. Measured 2026-07-29 with per-exit attribution: tokens
        # minted on a GitHub runner through WARP are accepted at ~4-5%, while the
        # Oracle VM's tokens — same producer stack, same browser, same rates, also
        # through WARP — are accepted at 100% in the same minutes. A single runner
        # is no better than a fleet (1 joined / 22 refused), and mint rate makes no
        # difference (per_min=10 and per_min=30 both collapse to 0%).
        #
        # The leading explanation is that WARP is Cloudflare's OWN product, so it
        # cannot hide an untrusted origin from Cloudflare's own Turnstile: it
        # restored *issuance* from AS8075 but not *standing* at siteverify. If that
        # is right, no number of WARP runners will ever work and the egress has to
        # be something Cloudflare does not operate.
        #
        #   warp     - control, the known-bad ~4% baseline
        #   vpngate  - free volunteer OpenVPN relays, many RESIDENTIAL (JP/KR).
        #              Changes the DEFAULT ROUTE, so no --proxy-server is used and
        #              the relay POST egresses through it too (attribution still
        #              sees the true exit). vpngate.py --index/--stride give N
        #              runners DISJOINT relays instead of all picking the fastest.
        #   webshare - our paid proxies. Diagnostic only: at ~0.75 MB/token, 800
        #              tok/min would be ~25 TB/month, so this can prove the point
        #              but cannot be the production answer.
        #   direct   - control. Expect 600010 (Cloudflare refuses to challenge
        #              AS8075 directly); confirms the runner itself is the problem.
        description: "warp | vpngate | webshare | direct"
        required: false
        default: "warp"
      probe_only:
        # Bring the tunnel up, print the ADDRESS-FAMILY reality inside it, and
        # stop. Exists because GitHub serves NO logs for an in-progress job
        # (verified: 215 bytes while step 6 was running), so the only way to
        # read a runner fact early is to make the job FINISH early.
        description: "Tunnel + IPv6 diagnostics only, then exit (no browser, no minting)"
        required: false
        default: "false"
      rotate_min:
        # LANE D. 0 = static (the control). N = tear the VPN Gate relay down
        # every N minutes and continue on the next relay in this job's slice.
        # The evidence this tests: an over-driven exit degrades and RECOVERS
        # with rest, and unlike WARP's sticky anycast v4 a VPN Gate relay can
        # actually be swapped. The confound it must survive is EXIT-SCALING
        # 5b -- a FRESH exit is refused for its first several minutes, so
        # rotation pays a warm-up tax on every handover and can be net
        # negative. Only the whole-cycle accepted rate settles it.
        description: "Rotate the vpngate exit every N minutes (0 = static control)"
        required: false
        default: "0"
      rotate_every:
        # THE CONFOUND CONTROL, and the reason this lane needs only one runner.
        #
        # Rotating the exit also RESTARTS Chromium, and producer.js is a
        # self-amplifying widget fork bomb (Lane F: `recycle()` has no in-flight
        # guard and every mint schedules another `build()`, so widget count
        # climbs ~1.2/s and minting freezes ~40 min in). A rotating runner
        # therefore gets a free producer reset every tenure that a static one
        # never gets -- so "rotator sustained, static collapsed" would be a
        # browser-restart result masquerading as an exit-rotation result.
        #
        # rotate_every=N restarts the browser EVERY tenure but only swaps the
        # exit every Nth one. Browser hygiene is then identical across tenures
        # and the ONLY thing that differs between block 1 and block N on an exit
        # is the exit's age. That is a PAIRED, within-runner comparison: immune
        # to relay-quality variance (two parallel runners always sit on two
        # different-quality volunteer lines) and to the ~15-min acceptance drift
        # that makes any across-time comparison provisional.
        description: "Swap the exit every Nth tenure; the others restart the browser only (1 = always swap)"
        required: false
        default: "1"
      vpngate_index:
        # Job K of N passes index=K stride=N so concurrent runners take disjoint
        # relays. Without it every runner ranks the feed identically, all pick the
        # same top relay, and they collide on ONE exit — the exact failure that
        # caps WARP's horizontal scale.
        description: "VPN Gate: this job's slice index (0-based)"
        required: false
        default: "0"
      vpngate_stride:
        description: "VPN Gate: total number of concurrent jobs sharing the feed"
        required: false
        default: "1"
      webshare_proxy:
        # One entry, `host:port:user:pass` (the format of the proxy list files).
        description: "webshare egress: host:port:user:pass"
        required: false
        default: ""
      browser:
        # cft136 mints ZERO with no `cf err` at all -- the challenge neither
        # errors nor solves, which is not the AS8075 signature (that is loud
        # 600010). Turnstile is known to weigh browser build age, and 136 is
        # far behind the VM's Chromium 148 that mints fine. `playwright` gets a
        # CURRENT Chromium, which unlike branded Chrome still honours
        # --load-extension when the feature flag is turned off.
        description: "playwright (modern Chromium, recommended) or cft136 (old, native --load-extension)"
        required: false
        default: "playwright"

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 358

    env:
      AUTH_SECRET: '74b163d6448f638bc82a6c5b9a6e64f1abd06e2bca6c47c148a041a5dc40f434'
      SITEKEY: '0x4AAAAAABBPKaIbNwnPEfSo'
      RELAY: 'https://mohanadino.duckdns.org:8443/add'
      SOCKS_PORT: '25344'

    steps:
      - name: 1. Runner facts (before any tunnel)
        run: |
          DIRECT_IP=$(curl -4 -s --max-time 15 https://api.ipify.org || echo unknown)
          echo "direct_egress=$DIRECT_IP"
          echo "DIRECT_IP=$DIRECT_IP" >> "$GITHUB_ENV"
          echo "asn=$(curl -s --max-time 15 https://ipinfo.io/org || echo unknown)"
          google-chrome --version || true
          chromium --version || true

      - name: 2. Install Xvfb + a browser that still honours --load-extension
        if: ${{ github.event.inputs.probe_only != 'true' }}
        env:
          BROWSER: ${{ github.event.inputs.browser }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # xdotool drives the pointer through XTEST. Every runner challenge
          # escalates to interactive mode and then waits forever for a click
          # nobody makes -- see step 6's click driver.
          sudo apt-get install -y --no-install-recommends xvfb unzip xdotool

          if [ "${BROWSER:-playwright}" = "playwright" ]; then
            # A CURRENT Chromium. Branded Chrome removed --load-extension in
            # M137 outright, but Chromium only gates it behind a feature flag,
            # which step 6 turns off. Playwright is used purely as a download
            # channel here -- the browser is launched by us, with no CDP and no
            # driver attached, which is the whole point of this recipe.
            npx --yes playwright@latest install --with-deps chromium >/dev/null 2>&1 || \
              npx --yes playwright@latest install chromium
            BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)
            [ -n "$BIN" ] || { echo 'playwright chromium not found' >&2; exit 1; }
            echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
            "$BIN" --version
            exit 0
          fi

          # The runner's preinstalled Chrome is 150. Chrome REMOVED
          # --load-extension in M137 (and the
          # --disable-features=DisableLoadExtensionCommandLineSwitch escape
          # hatch with it), so on the stock browser the extension silently never
          # runs -- which is exactly how this failed on the first attempt.
          # Chrome for Testing 136 is the last line that still loads it, and
          # pinning is the same discipline the Camoufox v135 pin exists for.
          #
          # NOT the apt `chromium` package: on 24.04 that is a snap wrapper
          # whose confinement cannot read /tmp/ext.
          VER=$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r '[.versions[]
                      | select((.version | split(".")[0] | tonumber) == 136)
                      | select(any(.downloads.chrome[]?; .platform == "linux64"))
                      | .version] | last')
          [ -n "$VER" ] && [ "$VER" != "null" ] || { echo 'no Chrome-for-Testing 136 build found' >&2; exit 1; }
          echo "pinning Chrome for Testing $VER"
          curl -fsSL --retry 3 -o /tmp/cft.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$VER/linux64/chrome-linux64.zip"
          sudo unzip -q /tmp/cft.zip -d /opt
          sudo chmod -R a+rX /opt/chrome-linux64
          echo "CHROME_BIN=/opt/chrome-linux64/chrome" >> "$GITHUB_ENV"
          /opt/chrome-linux64/chrome --version

      - name: 3. Bring up N Cloudflare WARP tunnels, one exit IP each
        env:
          FORBID: ${{ github.event.inputs.forbid_exits }}
          TUNNELS: ${{ github.event.inputs.tunnels }}
          EGRESS: ${{ github.event.inputs.egress }}
          VPNGATE_INDEX: ${{ github.event.inputs.vpngate_index }}
          VPNGATE_STRIDE: ${{ github.event.inputs.vpngate_stride }}
          WEBSHARE_PROXY: ${{ github.event.inputs.webshare_proxy }}
        run: |
          # `set +e` explicitly: GitHub invokes every step as `bash -e {0}` and
          # `set -uo pipefail` does NOT clear that. One tunnel failing to
          # register must not kill a job that can still run on the others --
          # without this the failing warp_up.sh subshell aborts the step before
          # the "continuing with fewer" branch can even report why. Only zero
          # tunnels is fatal: falling through to the runner's own AS8075 egress
          # would mint nothing but 600010 for hours.
          set +e +o pipefail
          TUNNELS="${TUNNELS:-3}"
          EGRESS="${EGRESS:-warp}"
          : > /tmp/tunnels.txt

          # tunnels.txt is `n <proxy-url-or-dash> <exit-v4> <label>`. Field 2 is a
          # FULL proxy URL now (it used to be a bare SOCKS port), because vpngate
          # and direct take no proxy at all and webshare needs credentials.
          if [ "$EGRESS" != "warp" ]; then
            case "$EGRESS" in
              vpngate)
                sudo apt-get install -y --no-install-recommends openvpn >/dev/null 2>&1
                curl -fsSL -o /tmp/vpngate.csv https://www.vpngate.net/api/iphone/
                echo '' | base64 -d > /tmp/vpngate.py
                mkdir -p /tmp/vpn
                python3 /tmp/vpngate.py /tmp/vpngate.csv /tmp/vpn \
                  --index "${VPNGATE_INDEX:-0}" --stride "${VPNGATE_STRIDE:-1}" || true
                # A slice can come back empty (feed shorter than index*stride, or a
                # bad fetch). Retry once unsliced rather than dying: an empty
                # directory made `openvpn --config /tmp/vpn/*.ovpn` try to open the
                # literal glob and fail the whole job.
                if ! ls /tmp/vpn/*.ovpn >/dev/null 2>&1; then
                  echo "slice ${VPNGATE_INDEX}/${VPNGATE_STRIDE} was empty — retrying unsliced"
                  python3 /tmp/vpngate.py /tmp/vpngate.csv /tmp/vpn || true
                fi
                ls /tmp/vpn/*.ovpn >/dev/null 2>&1 || { echo "::error::vpngate produced no configs"; head -3 /tmp/vpngate.csv; exit 1; }
                echo "relay candidates: $(ls /tmp/vpn/*.ovpn | wc -l)"
                before=$(curl -4 -s --max-time 10 https://api.ipify.org)
                echo "egress_before=$before"
                ok=""
                for cfg in /tmp/vpn/*.ovpn; do
                  echo "--- trying $(basename "$cfg") ---"
                  sudo openvpn --config "$cfg" --daemon --log /tmp/ovpn.log \
                    --connect-timeout 15 --connect-retry-max 1 || continue
                  for i in $(seq 1 20); do
                    now=$(curl -4 -s --max-time 5 https://api.ipify.org || true)
                    if [ -n "$now" ] && [ "$now" != "$before" ]; then ok="$now"; break; fi
                    sleep 2
                  done
                  [ -n "$ok" ] && break
                  sudo pkill openvpn; sleep 2
                done
                [ -n "$ok" ] || { echo "::error::no VPN Gate relay came up"; tail -20 /tmp/ovpn.log; exit 1; }
                echo "vpn_egress=$ok"
                # Which relay tenure 0 is sitting on. Lane D's rotation reads
                # this so the first re-pick cannot hand back the same relay.
                basename "$cfg" > /tmp/vpn_cfg_used
                curl -s --max-time 15 "https://ipinfo.io/${ok}/json" | tr -d '\n'; echo
                # Default route IS the tunnel, so no --proxy-server.
                echo "0 - $ok vpngate" >> /tmp/tunnels.txt
                ;;
              webshare)
                IFS=':' read -r wh wp wu wpw <<< "$WEBSHARE_PROXY"
                [ -n "$wh" ] || { echo "::error::webshare_proxy required"; exit 1; }
                PURL="http://$wu:$wpw@$wh:$wp"
                ip=$(curl -4 -s --max-time 20 --proxy "$PURL" https://api.ipify.org)
                [ -n "$ip" ] || { echo "::error::webshare proxy unreachable"; exit 1; }
                echo "webshare_egress=$ip"
                echo "0 $PURL $ip webshare" >> /tmp/tunnels.txt
                ;;
              direct)
                ip=$(curl -4 -s --max-time 15 https://api.ipify.org)
                echo "direct_egress=$ip (expect Cloudflare 600010 on AS8075)"
                echo "0 - $ip direct" >> /tmp/tunnels.txt
                ;;
              *) echo "::error::unknown egress $EGRESS"; exit 1 ;;
            esac
            UP=$(wc -l < /tmp/tunnels.txt)
            echo "TUNNELS_UP=$UP" >> "$GITHUB_ENV"
            echo "EXITIP=$(awk 'NR==1{print $3}' /tmp/tunnels.txt)" >> "$GITHUB_ENV"
            echo "egress=$EGRESS up=$UP"
            exit 0
          fi

          mkdir -p /tmp/warp && cd /tmp/warp
          echo '' | base64 -d > warp_up.sh
          chmod +x warp_up.sh

          # Claimed exits are deliberately NOT added to the forbid list. WARP's
          # IPv4 is anycast and a runner pins to ONE: run 30347933726 rolled five
          # fresh registrations and drew 104.28.196.79 every time, only the IPv6
          # /64 varying, so a v4 forbid-list rejected every roll and gave 1
          # tunnel of 3. (The "five runs, five exits" pattern that suggested
          # otherwise was variance BETWEEN runners, not between registrations on
          # one runner.)
          #
          # Whether tunnels sharing a v4 still scale is the open question this
          # now measures: memory warp-netns-multiplies-token-exits recorded 3
          # WARP lanes at 106.6 tok/min on the VM, while
          # vm-chromium-producer/README.md asserts shared-exit lanes cannot
          # multiply the ceiling. If the limit keys on the WARP registration
          # (fresh every roll) they scale; if it keys on the v4 they will not --
          # and the per-instance rates in [result] say which, instead of leaving
          # it to inference.
          CLAIMED="${FORBID:-}"
          for n in $(seq 0 $(( TUNNELS - 1 ))); do
            d=/tmp/warp/$n; mkdir -p "$d"; cp -f /tmp/warp/warp_up.sh "$d/"
            # Reuse tunnel 0's downloads; the release CDN 504s in bursts and
            # there is no reason to pull the same two binaries N times.
            cp -f /tmp/warp/0/wgcf /tmp/warp/0/wireproxy "$d/" 2>/dev/null || true
            port=$(( SOCKS_PORT + n ))
            ( cd "$d" && WARP_FORBID_EXITS="$CLAIMED" WARP_MAX_ROLLS=10 ./warp_up.sh "$port" ) \
              > "$d/out.txt" 2>&1
            rc=$?
            v4=$(sed -n 's/^exit_v4=//p' "$d/out.txt" | tail -1)
            v6=$(sed -n 's/^exit_ip=//p'  "$d/out.txt" | tail -1)
            colo=$(sed -n 's/^colo=//p'   "$d/out.txt" | tail -1)
            if [ -n "$v4" ] && [ "$v4" != "none" ] && [ "$v4" != "FAILED" ]; then
              echo "$n socks5://127.0.0.1:$port $v4 ${colo:-unknown}" >> /tmp/tunnels.txt
              echo "tunnel $n  port=$port  exit=$v4  colo=${colo:-unknown}  v6=${v6:-none}"
            else
              echo "tunnel $n FAILED to register (rc=$rc) -- continuing with fewer"
              # Every roll line, so a failure says whether it was collisions with
              # the forbid list or registration flakiness.
              grep -aE '^roll=|^rolls_used=|^exit_|forbid|did not come up' "$d/out.txt" | tail -14
            fi
          done

          UP=$(wc -l < /tmp/tunnels.txt)
          echo "tunnels_up=$UP of $TUNNELS"
          [ "$UP" -ge 1 ] || { echo "::error::no WARP tunnel came up"; exit 1; }
          echo "TUNNELS_UP=$UP" >> "$GITHUB_ENV"
          echo "EXITIP=$(awk 'NR==1{print $3}' /tmp/tunnels.txt)" >> "$GITHUB_ENV"

      - name: 3b. Address-family reality inside the tunnel
        run: |
          # WHY. The VM mints over IPv6 (each WARP namespace has its own v6 while
          # they SHARE one v4), and the relay only ever records the v4 because
          # the relay host has no usable AAAA -- so tokens are minted over v6 and
          # attributed over v4. If a GitHub runner's WARP tunnel is v4-only, then
          # "VM vs runner" is really "WARP v6 vs WARP v4", two address families
          # with potentially different standing at Cloudflare, and any conclusion
          # about AS8075 from that comparison is unfounded.
          #
          # Everything is measured THROUGH THE SOCKS PROXY, because that is what
          # Chrome uses. Measuring the runner's own stack answers a different
          # question -- WARP assigns its own v6 inside the tunnel, so a runner
          # with no host v6 can still egress v6.
          set +e
          PX=$(awk 'NR==1{print $2}' /tmp/tunnels.txt)
          echo "proxy_field=$PX"
          if [ "$PX" = "-" ] || [ -z "$PX" ]; then
            PXARG=(); echo "no proxy -- default route IS the tunnel"
          else
            PXARG=(--socks5-hostname "${PX#socks5://}")
          fi
          echo "=== natural family through the tunnel (what Chrome will pick) ==="
          curl -s --max-time 25 "${PXARG[@]}" https://www.cloudflare.com/cdn-cgi/trace | sed 's/^/  nat  /'
          echo "=== forced v4 through the tunnel ==="
          curl -4 -s --max-time 25 "${PXARG[@]}" https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=/  v4   ip=/p'
          echo "=== forced v6 through the tunnel ==="
          v6=$(curl -6 -s --max-time 25 "${PXARG[@]}" https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          if [ -n "$v6" ]; then echo "  v6   ip=$v6"; else echo "  v6   NONE -- this tunnel is IPv4-ONLY"; fi
          echo "=== the runner's OWN stack, outside the tunnel ==="
          ip -6 addr show scope global 2>/dev/null | sed 's/^/  /' || true
          hv6=$(curl -6 -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          if [ -n "$hv6" ]; then echo "  host v6 ip=$hv6"; else echo "  host has NO global v6"; fi
          echo "=== DNS families for the hosts that matter ==="
          getent ahosts gartic.io                | awk '{print "  gartic.io    " $1}' | sort -u
          getent ahosts challenges.cloudflare.com | awk '{print "  challenges   " $1}' | sort -u
          getent ahosts mohanadino.duckdns.org    | awk '{print "  relay        " $1}' | sort -u
          echo "=== VERDICT ==="
          if [ -n "$v6" ]; then
            echo "::notice::TUNNEL_HAS_V6 yes v6=$v6"
          else
            echo "::notice::TUNNEL_HAS_V6 no -- v4 only, so this runner cannot be compared like-for-like with the VM anchor"
          fi

      - name: 4a. Go toolchain (joinverify needs >= the version in its go.mod)
        if: ${{ github.event.inputs.probe_only != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: 4. Build the join verifier
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/jv && cd /tmp/jv
          echo '' | base64 -d | tar xzf -
          go build -o /tmp/joinverify .
          # A verifier that cannot answer REJECTED for an obviously bogus token
          # is measuring itself, not gartic.
          SELFPX=$(awk 'NR==1{print $2}' /tmp/tunnels.txt)
          if [ "$SELFPX" = "-" ] || [ -z "$SELFPX" ]; then
            /tmp/joinverify '1.AAAAAAAAAAAA.BBBBBBBB' \
              | sed 's/^/selftest(bogus token, expect REJECTED code=5): /'
          else
            /tmp/joinverify -proxy "$SELFPX" '1.AAAAAAAAAAAA.BBBBBBBB' \
              | sed 's/^/selftest(bogus token, expect REJECTED code=5): /'
          fi

      - name: 5. Write the MV3 extension
        if: ${{ github.event.inputs.probe_only != 'true' }}
        env:
          LANES: ${{ github.event.inputs.lanes }}
          PER_MIN: ${{ github.event.inputs.per_min }}
          POST_TO_RELAY: ${{ github.event.inputs.post_to_relay }}
          STRIP_DOM: ${{ github.event.inputs.strip_dom }}
          ROTATE_FP: ${{ github.event.inputs.rotate_fp }}
          RECYCLE_MIN: ${{ github.event.inputs.recycle_min }}
          APPEARANCE: ${{ github.event.inputs.appearance }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ext
          cat > /tmp/ext/manifest.json <<'MANIFEST'
          {
            "manifest_version": 3,
            "name": "gartic token producer",
            "version": "1.0",
            "host_permissions": ["https://gartic.io/*", "https://mohanadino.duckdns.org/*"],
            "content_scripts": [{
              "matches": ["https://gartic.io/*"],
              "js": ["producer.js"],
              "run_at": "document_idle",
              "world": "MAIN"
            }]
          }
          MANIFEST

          # Runner variant of tunnel system/vm-chromium-producer/producer.js.
          # Two differences from the VM copy:
          #
          #   1. It emits the FULL token on a `TOKFULL` line so the job can
          #      verify acceptance. That line goes to the Chrome log file, which
          #      is never printed or uploaded -- the repo is public.
          #   2. It emits `CLICKAT lane=<i> x=<sx> y=<sy>` in SCREEN coordinates
          #      for any lane that is on screen and still unsolved, so step 6's
          #      xdotool driver can click the checkbox. On the runner every
          #      challenge escalates to interactive mode (BEFORE_INTERACTIVE on
          #      every build, AFTER_INTERACTIVE never, no `cf err`, no token,
          #      across three different WARP exits in three colos) -- the widget
          #      is not failing, it is waiting for a click. The VM never needed
          #      this because most of its challenges never escalate.
          #
          # Lanes are 320px apart, not 180: an interaction-only widget is ~300px
          # wide once it becomes visible, so the old spacing made them overlap
          # and put lane 1's checkbox underneath lane 0.
          cat > /tmp/ext/producer.js <<'PRODUCER'
          (function () {
            'use strict';
            var RELAY  = '__RELAY__';
            var SECRET = '__SECRET__';
            var KEY    = '__SITEKEY__';
            var LANES  = __LANES__;
            var PER_MIN = __PER_MIN__;
            var POST = __POST__;
            var STRIP = __STRIP__;
            var ROTATE_FP = __ROTATE__;
            var RECYCLE_MIN = __RECYCLE__;
            var APPEARANCE = '__APPEARANCE__';
            var LABEL = '__LABEL__';
            var GAP = Math.round(60000 / PER_MIN);
            var nextAllowed = 0, minted = 0, posted = 0;
            // `built` is CUMULATIVE Turnstile widget renders = the rate at which
            // this browser SOLICITS CHALLENGES from Cloudflare, which is not the
            // same thing as its token output and may well be the quantity gartic
            // and Cloudflare actually judge. `recycle()` has no in-flight guard
            // (Lane F), so build() can be scheduled more than once per lane and
            // this climbs superlinearly while `minted` stays flat.
            var built = 0;

            function log(){ console.log.apply(console, ['[producer]'].concat([].slice.call(arguments))); }

            // The POST goes through this browser's WARP tunnel, so the relay
            // sees the minting exit as the TCP peer and scores that exit
            // against icebot's real join verdicts (/stats/exits). LABEL is
            // only a convenience for mapping an exit back to a run -- the relay
            // never keys on it, because a producer could choose it.
            function post(tok) {
              if (!POST) { posted++; return; }
              fetch(RELAY, { method:'POST',
                headers:{'Content-Type':'application/json','X-Auth':SECRET},
                // LIVE TELEMETRY, no new infrastructure. The relay stores the
                // last label verbatim per exit and serves it on /stats/exits, so
                // appending the live widget count and the cumulative render count
                // turns that endpoint into a per-minute time series of the fork
                // bomb -- readable from off-box while the job is still running,
                // which GitHub's in-progress job logs are NOT.
                //   w<N> = live widgets now   b<M> = widgets rendered ever
                //   m<K> = tokens minted by THIS browser since it started
                // (`m` is Lane B's field, adopted verbatim so every lane's
                // label parses identically and the numbers compare directly.)
                body: JSON.stringify({token: tok, label: LABEL
                  + '|w' + document.querySelectorAll('[id^="prod_"]').length
                  + 'b' + built + 'm' + minted})
              }).then(function(r){ if(r.ok){posted++;} log('posted', r.status, 'minted='+minted, 'posted='+posted); })
                .catch(function(e){ log('relay error', e && e.message); });
            }

            // Viewport point -> X11 screen point. outerHeight-innerHeight is the
            // browser chrome above the page; the horizontal term splits any
            // window border evenly. Self-correcting, so the window can sit
            // anywhere without the click driver needing to know where.
            //
            // devicePixelRatio is NOT optional: getBoundingClientRect() and
            // screenX are CSS pixels, while xdotool/XTEST address DEVICE pixels.
            // On a 175%-scaled display this error put the click ~1000px off the
            // widget -- which looks exactly like Cloudflare refusing us, the
            // same silent-failure shape that has already caused two multi-day
            // misdiagnoses here. Xvfb runs at 1x so the runner never saw it.
            function toScreen(r) {
              var dpr = window.devicePixelRatio || 1;
              var padX = Math.max(0, (window.outerWidth - window.innerWidth) / 2);
              var padY = Math.max(0, window.outerHeight - window.innerHeight);
              return { x: Math.round(((window.screenX || 0) + padX + r.left) * dpr),
                       y: Math.round(((window.screenY || 0) + padY + r.top) * dpr),
                       dpr: dpr };
            }

            function lane(i) {
              // LANE F's fork-bomb guard. recycle() had no in-flight guard and
              // every mint scheduled another build(), so live widgets climbed
              // ~1.2/s while `minted` stayed flat. `gen` invalidates every
              // pending callback of a superseded chain, so a stale timer dies
              // instead of spawning a rival builder.
              var gen = 0;
              var CAP = LANES * 3;              // hard ceiling on live widgets
              var slot, id, sawInter;
              function purge(sel) {
                var olds = document.querySelectorAll(sel);
                for (var k = 0; k < olds.length; k++) {
                  var wid = olds[k].getAttribute('data-wid');
                  if (wid) { try { window.turnstile.remove(wid); } catch (e) {} }
                  if (olds[k].parentNode) olds[k].parentNode.removeChild(olds[k]);
                }
                return olds.length;
              }
              function mine() { return 'div[id^="prod_' + i + '_"]'; }
              function build() {
                var myGen = gen;
                built++;
                sawInter = false;
                purge(mine());
                var live = document.querySelectorAll('div[id^="prod_"]').length;
                if (live >= CAP) {
                  log('FORKBOMB cap=' + CAP + ' live=' + live + ' lane=' + i +
                      ' -- purging every lane and rebuilding');
                  purge('div[id^="prod_"]');
                }
                slot = document.createElement('div');
                slot.id = 'prod_' + i + '_' + myGen;
                // The class off-the-shelf Turnstile helpers look for. Our own
                // driver finds the widget by rect and does not need it, but a
                // bench measured stock helpers at 3/3 on a classed widget and
                // 0/2 on a bare div -- so this one line keeps any future
                // clicker (SeleniumBase's, or a CDP one) able to find us.
                slot.className = 'cf-turnstile';
                slot.style.cssText = 'position:fixed;left:' + (10 + i*320) + 'px;bottom:10px;z-index:2147483647';
                document.body.appendChild(slot);
                try {
                  id = window.turnstile.render(slot, {
                    sitekey: KEY, action: 'join', appearance: APPEARANCE,
                    callback: function(){},
                    'error-callback': function(c){ log('cf err', c); defer(myGen, 2000); },
                    'before-interactive-callback': function(){ sawInter = true; log('BEFORE_INTERACTIVE (lane '+i+')'); },
                    'after-interactive-callback': function(){ log('AFTER_INTERACTIVE (lane '+i+')'); },
                    'timeout-callback': function(){ defer(myGen, 0); }
                  });
                  slot.setAttribute('data-wid', String(id));
                } catch (e) { log('render threw', e && e.message); defer(myGen, 3000); return; }
                poll(0, myGen);
              }
              function read() {
                try { var t = window.turnstile.getResponse(id); if (t) return t; } catch(e){}
                var el = slot && slot.querySelector('input[name="cf-turnstile-response"]');
                return el && el.value ? el.value : null;
              }
              // Publish where this lane's checkbox is, in screen coordinates, so
              // the xdotool driver can hit it. Deliberately NOT tied to
              // before-interactive: a lane that is on screen and unsolved wants
              // a click whichever callback did or did not fire.
              function emitClick() {
                if (!slot) return;
                var r = slot.getBoundingClientRect();
                if (r.width < 20 || r.height < 20) return;   // still collapsed
                var p = toScreen(r);
                // The checkbox sits at the left end of an expanded widget; on a
                // small box aim at its centre instead.
                var ox = r.width >= 200 ? 30 : Math.round(r.width / 2);
                // Offsets are CSS pixels too, so they scale with the rest.
                var cx = p.x + Math.round(ox * p.dpr),
                    cy = p.y + Math.round((r.height / 2) * p.dpr);
                // An off-screen window yields absurd screen coords (a bench log
                // showed CLICKAT x=-18246 y=-17578). The pointer then lands
                // nowhere, the widget is never clicked, and the run looks
                // exactly like "Cloudflare refused us" -- a silent failure of
                // precisely the kind that has already cost this project two
                // multi-day misdiagnoses. Refuse to emit, and say why.
                // screen.width/height are CSS pixels as well -- compare like
                // with like, or the bounds check itself misfires on HiDPI.
                var sw = Math.round(((window.screen && window.screen.width)  || 1280) * p.dpr);
                var sh = Math.round(((window.screen && window.screen.height) || 900)  * p.dpr);
                if (cx < 0 || cy < 0 || cx > sw || cy > sh) {
                  log('CLICKOFFSCREEN lane=' + i + ' x=' + cx + ' y=' + cy +
                      ' screen=' + sw + 'x' + sh + ' dpr=' + p.dpr +
                      ' -- window is off-screen, not clicking');
                  return;
                }
                log('CLICKAT lane=' + i + ' x=' + cx + ' y=' + cy + ' dpr=' + p.dpr);
              }
              function poll(n, myGen) {
                if (myGen !== gen) return;      // a stale chain must die, not recycle
                var t = read();
                if (t) {
                  var now = Date.now();
                  var wait = Math.max(0, nextAllowed - now);
                  nextAllowed = Math.max(now, nextAllowed) + GAP;
                  minted++;
                  log('TOKEN lane'+i, 'len='+t.length, 'head='+t.slice(0,16), 'solve='+(sawInter?'int':'auto'));
                  log('TOKFULL ' + (sawInter ? 'int' : 'auto') + ' ' + t);
                  setTimeout(function(){ post(t); }, wait);
                  defer(myGen, wait + 500);
                  return;
                }
                if (n > 60) { defer(myGen, 0); return; }
                if (n % 5 === 2) emitClick();
                setTimeout(function(){ poll(n+1, myGen); }, 1000);
              }
              // defer()/recycle() are the ONLY route back to build().
              // Do not add another caller -- that is exactly how this happened.
              function defer(myGen, ms) {
                if (myGen !== gen) return;
                setTimeout(function(){ recycle(myGen); }, ms);
              }
              function recycle(myGen) {
                if (myGen !== gen) return;      // someone already recycled this gen
                gen++;                          // invalidates every pending callback
                try { window.turnstile.remove(id); } catch(e){}
                purge(mine());
                slot = null; id = null;
                setTimeout(build, 400);
              }
              return build;
            }

            // The old DIAG printed `iframes=0` for BOTH a minting VM and a dead
            // runner, so it decided nothing -- a top-level
            // `iframe[src*=challenges.cloudflare.com]` query misses an iframe
            // that Turnstile put inside a descendant's shadow root. Report each
            // lane's real size and iframe count, light DOM and shadow DOM, so a
            // zero-mint run says whether the widget drew at all.
            setInterval(function(){
              var ifr = document.querySelectorAll('iframe[src*="challenges.cloudflare.com"]').length;
              var boxes = document.querySelectorAll('[id^="prod_"]');
              var parts = [];
              for (var b = 0; b < boxes.length; b++) {
                var el = boxes[b], r = el.getBoundingClientRect();
                var kids = el.querySelectorAll('*'), sr = 0;
                for (var k = 0; k < kids.length; k++) {
                  if (kids[k].shadowRoot) sr += kids[k].shadowRoot.querySelectorAll('iframe').length;
                }
                parts.push(el.id + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) +
                           ' ifr=' + el.querySelectorAll('iframe').length + ' srIfr=' + sr +
                           ' resp=' + (el.querySelector('input[name="cf-turnstile-response"]') ? 1 : 0));
              }
              log('DIAG iframes=' + ifr + ' lanes=' + boxes.length + ' minted=' + minted +
                  ' posted=' + posted + ' | ' + parts.join(' | '));
            }, 20000);

            // gartic's homepage is a heavy Next.js app that animates
            // continuously, and on a runner the binding constraint is CPU: 3
            // tunnels and 5 tunnels both total 27/min, with per-instance rate
            // falling 9 -> 5 as instances are added. We need this origin (the
            // siteverify hostname must be gartic.io) and its window.turnstile
            // -- we do not need its UI. Dropping the DOM frees that CPU for
            // solving. window.turnstile is already captured and lives on, and
            // the lanes render into elements we create ourselves.
            // Re-roll the two vectors Camoufox actually varies. Measured across
            // 4 Camoufox launches: canvasHash 4/4 distinct, webglRenderer 4/4
            // distinct, while userAgent/platform/timezone stayed constant.
            // Noise is deliberately tiny -- flip the low bit of a handful of
            // pixels -- so the canvas still renders correctly and only its hash
            // moves. A heavy-handed spoof is itself a detection signal.
            function rotateFingerprint() {
              var seed = (Math.random() * 2147483647) | 0;
              function rnd(n) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; }

              try {
                var origToDataURL = HTMLCanvasElement.prototype.toDataURL;
                var origGetImageData = CanvasRenderingContext2D.prototype.getImageData;
                function perturb(d) {
                  var px = d.data.length >> 2;
                  for (var k = 0; k < 8 && px > 0; k++) {
                    var idx = rnd(px) << 2;
                    d.data[idx] = d.data[idx] ^ 1;
                  }
                  return d;
                }
                CanvasRenderingContext2D.prototype.getImageData = function () {
                  return perturb(origGetImageData.apply(this, arguments));
                };
                HTMLCanvasElement.prototype.toDataURL = function () {
                  try {
                    var c = this.getContext && this.getContext('2d');
                    if (c && this.width && this.height) {
                      c.putImageData(perturb(origGetImageData.call(c, 0, 0, this.width, this.height)), 0, 0);
                    }
                  } catch (e) {}
                  return origToDataURL.apply(this, arguments);
                };
              } catch (e) { log('fp canvas patch failed', e && e.message); }

              // 37445 = UNMASKED_VENDOR_WEBGL, 37446 = UNMASKED_RENDERER_WEBGL.
              var GPUS = [
                ['Google Inc. (Intel)',  'ANGLE (Intel, Intel(R) UHD Graphics 630 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Google Inc. (NVIDIA)', 'ANGLE (NVIDIA, NVIDIA GeForce GTX 1060 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Google Inc. (AMD)',    'ANGLE (AMD, AMD Radeon RX 580 Direct3D11 vs_5_0 ps_5_0, D3D11)'],
                ['Intel Inc.',           'Intel Iris OpenGL Engine']
              ];
              var gpu = GPUS[rnd(GPUS.length)];
              try {
                [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (C) {
                  if (!C || !C.prototype) return;
                  var orig = C.prototype.getParameter;
                  C.prototype.getParameter = function (p) {
                    if (p === 37445) return gpu[0];
                    if (p === 37446) return gpu[1];
                    return orig.apply(this, arguments);
                  };
                });
              } catch (e) { log('fp webgl patch failed', e && e.message); }

              try {
                var cores = [2, 4, 8, 12, 16][rnd(5)];
                Object.defineProperty(navigator, 'hardwareConcurrency', { get: function () { return cores; } });
              } catch (e) {}

              log('FP rotated gpu=' + gpu[1].slice(0, 30));
            }

            function stripPage() {
              try {
                document.body.innerHTML = '';
                document.body.style.cssText = 'background:#202020;margin:0';
                if (document.title) document.title = 'p';
                log('page stripped for CPU');
              } catch (e) { log('strip failed', e && e.message); }
            }

            var waited = 0;
            (function wait() {
              if (window.turnstile && window.turnstile.render) {
                log('turnstile present -- starting', LANES, 'lanes');
                // Rotate BEFORE rendering any widget, or the challenge reads the
                // real canvas/WebGL and the rotation buys nothing.
                if (ROTATE_FP) rotateFingerprint();
                if (STRIP) stripPage();
                // A page reload re-runs this content script with a fresh seed,
                // i.e. a fresh identity, without paying to restart Chromium.
                if (RECYCLE_MIN > 0) {
                  setTimeout(function () {
                    log('RECYCLE reloading for a fresh identity');
                    location.reload();
                  }, RECYCLE_MIN * 60000);
                }
                for (var i = 0; i < LANES; i++) setTimeout(lane(i), i * 800);
                return;
              }
              if ((waited += 250) > 60000) { log('window.turnstile NEVER appeared'); return; }
              setTimeout(wait, 250);
            })();
          })();
          PRODUCER

          if [ "$POST_TO_RELAY" = "true" ]; then POSTJS=true; else POSTJS=false; fi
          if [ "${STRIP_DOM:-true}" = "true" ]; then STRIPJS=true; else STRIPJS=false; fi
          if [ "${ROTATE_FP:-false}" = "true" ]; then ROTJS=true; else ROTJS=false; fi
          RECJS="${RECYCLE_MIN:-0}"
          APPJS="${APPEARANCE:-interaction-only}"
          LABELJS="gh-${GITHUB_RUN_ID:-unknown}"
          # Everything EXCEPT the label is fixed for the whole run; the label
          # changes on every rotation, so a pristine copy with __LABEL__ still in
          # place is kept and re-stamped per tenure (step 6 set_label).
          sed -i "s|__RELAY__|$RELAY|; s|__SECRET__|$AUTH_SECRET|; s|__SITEKEY__|$SITEKEY|; s|__LANES__|$LANES|; s|__PER_MIN__|$PER_MIN|; s|__POST__|$POSTJS|; s|__STRIP__|$STRIPJS|; s|__ROTATE__|$ROTJS|; s|__RECYCLE__|$RECJS|; s|__APPEARANCE__|$APPJS|" /tmp/ext/producer.js
          cp /tmp/ext/producer.js /tmp/ext/producer.js.tpl
          sed -i "s|__LABEL__|$LABELJS|" /tmp/ext/producer.js
          echo "rotate_fp=$ROTJS recycle_min=$RECJS"
          grep -c . /tmp/ext/producer.js

      - name: 6. Mint
        if: ${{ github.event.inputs.probe_only != 'true' }}
        timeout-minutes: 350
        continue-on-error: true
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
          VERIFY_EVERY: ${{ github.event.inputs.verify_every }}
          CLICK_STYLE: ${{ github.event.inputs.click_style }}
          APPEARANCE: ${{ github.event.inputs.appearance }}
          ROTATE_MIN: ${{ github.event.inputs.rotate_min }}
          ROTATE_EVERY: ${{ github.event.inputs.rotate_every }}
          EGRESS: ${{ github.event.inputs.egress }}
          VPNGATE_INDEX: ${{ github.event.inputs.vpngate_index }}
          VPNGATE_STRIDE: ${{ github.event.inputs.vpngate_stride }}
        run: |
          # ===================== LANE D: ROTATION =============================
          # The shared template mints in ONE tenure on the relay step 3 brought
          # up. Here the mint phase is a TENURE LOOP:
          #
          #   rotate_min=0  -> one tenure, byte-equivalent behaviour (the CONTROL)
          #   rotate_min=N  -> every N minutes: stop Chromium, tear the OpenVPN
          #                    relay down, verify the runner is back on its own
          #                    route, bring up the NEXT relay in this job's
          #                    vpngate slice, verify the exit IP actually moved,
          #                    refuse it if another lane is live on it, relabel
          #                    the producer `gh-<runid>-r<tenure>` and relaunch.
          #
          # Chromium is RESTARTED, not reloaded. The default route moves out
          # from under every in-flight socket, and the extension's LABEL is
          # baked in at load time, so a reload could neither recover cleanly nor
          # retag the exit. The restart cost is REAL and is deliberately counted
          # inside the tenure: the number this experiment exists to produce is
          # accepted tokens per minute averaged over the WHOLE cycle including
          # handover and warm-up, not a mid-tenure peak.
          #
          # GitHub invokes every step as `bash -e`, and `set -uo pipefail` does
          # NOT clear that. A monitoring loop must not be fatal: `grep -c`
          # exits 1 when the count is zero, so `MINTED=$(grep -ac ...)` killed
          # this step 30s in, before the first token had been minted.
          set +e +o pipefail
          MINUTES="${MINUTES:-300}"
          VERIFY_EVERY="${VERIFY_EVERY:-180}"
          CLICK_STYLE="${CLICK_STYLE:-human}"
          ROTATE_MIN="${ROTATE_MIN:-0}"
          ROTATE_EVERY="${ROTATE_EVERY:-1}"
          # SAFETY: the tenure loop's rotate_tunnel() is OpenVPN/VPN-Gate-specific.
          # On any other egress it would find no /tmp/vpn candidates, call
          # refresh_feed(), and silently convert a WARP run into a VPN Gate run --
          # which would not merely fail, it would answer the wrong question while
          # looking like it answered the right one. Refuse instead.
          if [ "${EGRESS:-warp}" != "vpngate" ] && [ "$ROTATE_MIN" -gt 0 ]; then
            echo "::warning::rotate_min=$ROTATE_MIN ignored -- exit rotation is implemented for egress=vpngate only (this run is egress=${EGRESS})"
            ROTATE_MIN=0
          fi
          MYRUN="gh-${GITHUB_RUN_ID:-unknown}"
          echo "click style: $CLICK_STYLE   rotate_min: $ROTATE_MIN min"
          mapfile -t TUNS < /tmp/tunnels.txt
          NINST=${#TUNS[@]}
          echo "starting $NINST producer instance(s) -- one browser per exit IP"

          # One Xvfb PER INSTANCE, started ONCE -- displays outlive tenures.
          # Every browser then sits at 0,0 on its own display, so the CLICKAT
          # screen coordinates are identical but never collide.
          for t in "${TUNS[@]}"; do
            set -- $t
            Xvfb ":$(( 97 + $1 ))" -screen 0 1280x900x24 -ac -nolisten tcp >/dev/null 2>&1 &
          done
          sleep 4

          # Collision guard. Six lanes share one relay and one VPN Gate feed; if
          # a re-pick lands on an exit another lane is actively minting through,
          # both lanes' per-exit numbers become meaningless. /stats/exits carries
          # the producer label, so a live foreign label on an address is a
          # sufficient reason to put that relay back and take the next one.
          cat > /tmp/collide.py <<'PY'
          import json, os, sys
          ip, mine = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open('/tmp/exits.json'))
          except Exception:
              sys.exit(1)                      # cannot tell -> do not block
          for e in d.get('exits', []):
              if e.get('src') == ip:
                  lbl = e.get('label') or ''
                  if lbl and not lbl.startswith(mine) and e.get('lastSeenSecAgo', 10**9) < 900:
                      print('held by', lbl, '(seen', e.get('lastSeenSecAgo'), 's ago)')
                      sys.exit(0)              # collision
          sys.exit(1)
          PY

          CFGDIR=/tmp/vpn
          USED=/tmp/used_hosts.txt
          : > "$USED"
          # Step 3 already consumed one relay for tenure 0; do not hand it back
          # on the first rotation.
          [ -s /tmp/vpn_cfg_used ] && sed 's/\.ovpn$//' /tmp/vpn_cfg_used | cut -d- -f3- >> "$USED"

          cfg_host() { basename "$1" .ovpn | cut -d- -f3-; }

          refresh_feed() {
            echo "[rotate] refreshing VPN Gate feed (slice ${VPNGATE_INDEX}/${VPNGATE_STRIDE})"
            curl -fsSL --max-time 90 -o /tmp/vpngate.csv https://www.vpngate.net/api/iphone/ || return 1
            rm -f "$CFGDIR"/*.ovpn
            python3 /tmp/vpngate.py /tmp/vpngate.csv "$CFGDIR" \
              --index "${VPNGATE_INDEX:-1}" --stride "${VPNGATE_STRIDE:-1}" --count 16 2>&1 | tail -18
            ls "$CFGDIR"/*.ovpn >/dev/null 2>&1
          }

          # Next unused relay in THIS job's slice. Staying inside the slice is
          # what keeps lanes disjoint. When the slice is exhausted the feed is
          # re-fetched (volunteer relays churn); when even that yields nothing
          # new the used-list is cleared, which is the RECOVERY TEST -- we come
          # back to a relay this job drove hours earlier and see whether its
          # tokens are accepted again.
          next_candidate() {
            local c h
            for c in "$CFGDIR"/*.ovpn; do
              [ -e "$c" ] || continue
              h=$(cfg_host "$c")
              grep -qxF "$h" "$USED" 2>/dev/null && continue
              echo "$h" >> "$USED"
              echo "$c"; return 0
            done
            return 1
          }

          kill_tunnel() {
            sudo pkill -TERM openvpn 2>/dev/null; sleep 3
            sudo pkill -KILL openvpn 2>/dev/null; sleep 1
            # Deleting the tun device removes the 0.0.0.0/1 + 128.0.0.0/1
            # redirect-gateway routes with it. Relying on OpenVPN to unwind them
            # itself is how a runner ends up with no default route at all -- and
            # a stranded runner burns a concurrency slot for hours.
            local d
            for d in $(ip -o link show 2>/dev/null | awk -F': ' '/tun[0-9]/{print $2}' | cut -d@ -f1); do
              sudo ip link delete "$d" 2>/dev/null
            done
          }

          rotate_tunnel() {
            local back="" i cfg now tries=0
            kill_tunnel
            for i in $(seq 1 20); do
              back=$(curl -4 -s --max-time 5 https://api.ipify.org || true)
              [ -n "$back" ] && break
              sleep 2
            done
            if [ -z "$back" ]; then
              echo "[rotate] ::error:: no connectivity after teardown -- runner is stranded"
              return 1
            fi
            echo "[rotate] tunnel down, egress back to $back"
            while [ "$tries" -lt 14 ]; do
              tries=$(( tries + 1 ))
              cfg=$(next_candidate)
              if [ -z "$cfg" ]; then
                refresh_feed || true
                cfg=$(next_candidate)
              fi
              if [ -z "$cfg" ]; then
                echo "[rotate] slice exhausted -- clearing used list (REVISIT: recovery test)"
                : > "$USED"
                cfg=$(next_candidate) || { echo "[rotate] ::error:: no candidates at all"; return 1; }
              fi
              echo "[rotate] trying $(basename "$cfg")"
              sudo openvpn --config "$cfg" --daemon --log /tmp/ovpn.log \
                --connect-timeout 15 --connect-retry-max 1 || continue
              now=""
              for i in $(seq 1 20); do
                now=$(curl -4 -s --max-time 5 https://api.ipify.org || true)
                [ -n "$now" ] && [ "$now" != "$back" ] && break
                now=""; sleep 2
              done
              if [ -z "$now" ]; then
                echo "[rotate] $(basename "$cfg") did not come up"
                kill_tunnel; continue
              fi
              curl -s --max-time 25 -H "X-Auth: $AUTH_SECRET" \
                "https://mohanadino.duckdns.org:8443/stats/exits" > /tmp/exits.json 2>/dev/null
              if python3 /tmp/collide.py "$now" "$MYRUN"; then
                echo "[rotate] $now collides with another lane -- putting it back"
                kill_tunnel
                for i in $(seq 1 15); do
                  back=$(curl -4 -s --max-time 5 https://api.ipify.org || true); [ -n "$back" ] && break; sleep 2
                done
                continue
              fi
              echo "0 - $now vpngate" > /tmp/tunnels.txt
              mapfile -t TUNS < /tmp/tunnels.txt
              echo "[rotate] NEW EXIT $now via $(basename "$cfg")"
              curl -s --max-time 15 "https://ipinfo.io/${now}/json" | tr -d '\n'; echo
              return 0
            done
            echo "[rotate] ::error:: exhausted $tries relay attempts"
            return 1
          }

          # The extension is read from disk at launch, so the label is set by
          # rewriting producer.js from the pristine copy step 5 kept.
          set_label() {
            sed "s|__LABEL__|$1|" /tmp/ext/producer.js.tpl > /tmp/ext/producer.js
          }

          simple_click() {
            local x="$1" y="$2"
            xdotool mousemove --sync $(( x - 40 )) $(( y - 25 )) sleep 0.12 \
                    mousemove --sync $(( x - 12 )) $(( y - 6 ))  sleep 0.09 \
                    mousemove --sync "$x" "$y" sleep 0.18 click 1 >/dev/null 2>&1
          }
          human_click() {
            local tx="$1" ty="$2" args hold
            args=$(awk -v tx="$tx" -v ty="$ty" -v seed="$RANDOM$idx" '
              BEGIN{
                srand(seed); pi=3.14159265;
                ang = rand()*360; dist = 80 + rand()*140; steps = 14 + int(rand()*8);
                sx = tx + dist*cos(ang*pi/180); sy = ty + dist*sin(ang*pi/180);
                if (sx < 5) sx = 5; if (sx > 1275) sx = 1275;
                if (sy < 5) sy = 5; if (sy > 895) sy = 895;
                ox = tx + (rand()*8-4); oy = ty + (rand()*6-3);
                for (i=1; i<=steps; i++) {
                  t = i/steps;
                  e = (t<0.5) ? 4*t*t*t : 1-((-2*t+2)^3)/2;
                  printf "mousemove --sync %d %d sleep %.3f ",
                         sx+(ox-sx)*e + (rand()*2.4-1.2),
                         sy+(oy-sy)*e + (rand()*2.4-1.2),
                         0.008+rand()*0.022;
                }
                printf "mousemove --sync %d %d sleep %.3f ", tx, ty, 0.09+rand()*0.14;
              }')
            hold=$(awk -v s="$RANDOM" 'BEGIN{srand(s); printf "%.3f", 0.06+rand()*0.08}')
            xdotool $args mousedown 1 >/dev/null 2>&1
            sleep "$hold"
            xdotool mouseup 1 >/dev/null 2>&1
          }
          click_driver() {
            local idx="$1" log="/tmp/chrome-$1.log" last=0 total
            export DISPLAY=":$(( 97 + idx ))"
            while :; do
              sleep 4
              total=$(wc -c < "$log" 2>/dev/null || echo 0)
              [ "${total:-0}" -le "$last" ] && { last=${total:-0}; continue; }
              tail -c +$(( last + 1 )) "$log" 2>/dev/null \
                | grep -ao 'CLICKAT lane=[0-9]* x=-\?[0-9]* y=-\?[0-9]*' \
                | awk '{print $2, $3, $4}' | sed 's/[a-z]*=//g' | sort -u -k1,1 \
                | while read -r ln x y; do
                    [ -n "$x" ] && [ -n "$y" ] || continue
                    if [ "$CLICK_STYLE" = "simple" ]; then
                      simple_click "$x" "$y"
                    else
                      human_click "$x" "$y"
                    fi
                    echo "[click] inst=$idx lane=$ln at $x,$y" >> "/tmp/clicks-$idx.log"
                  done
              last=$total
            done
          }

          IDX=(); PIDS=(); PORTS=(); LOGS=(); CLICKERS=()

          start_instances() {
            IDX=(); PIDS=(); PORTS=(); LOGS=(); CLICKERS=()
            local t n purl v4 colo log up
            for t in "${TUNS[@]}"; do
              set -- $t; n=$1; purl=$2; v4=$3; colo=$4
              log="/tmp/chrome-$n.log"; : > "$log"; : > "/tmp/clicks-$n.log"
              # vpngate and direct move the DEFAULT ROUTE, so they take no
              # --proxy-server at all; warp and webshare pass a full proxy URL.
              pxarg=()
              [ "$purl" != "-" ] && pxarg=(--proxy-server="$purl")
              DISPLAY=":$(( 97 + n ))" "$CHROME_BIN" \
                --no-sandbox --disable-gpu --no-first-run --no-default-browser-check \
                --disable-dev-shm-usage \
                --user-data-dir="/tmp/chrome-profile-$n" \
                --window-position=0,0 --window-size=1280,880 \
                "${pxarg[@]}" \
                --disable-features=DisableLoadExtensionCommandLineSwitch \
                --disable-extensions-except=/tmp/ext \
                --load-extension=/tmp/ext \
                --enable-logging=stderr --v=0 \
                "https://gartic.io/" >> "$log" 2>&1 &
              IDX+=("$n"); PIDS+=($!); PORTS+=("$purl"); LOGS+=("$log")
              echo "instance $n -> display :$(( 97 + n ))  proxy ${purl}  exit $v4 ($colo)"
            done
            for _ in $(seq 1 24); do
              up=0
              for log in "${LOGS[@]}"; do grep -aq '\[producer\]' "$log" && up=$(( up + 1 )); done
              [ "$up" -eq "$NINST" ] && break
              sleep 5
            done
            up=0; for log in "${LOGS[@]}"; do grep -aq '\[producer\]' "$log" && up=$(( up + 1 )); done
            if [ "$up" -eq 0 ]; then
              echo "::error::extension never executed -- --load-extension was ignored or the page never loaded"
              "$CHROME_BIN" --version; tail -40 "${LOGS[0]}"
              return 1
            fi
            echo "extension is running in $up/$NINST instance(s)"
            # A self-solving widget must not be clicked -- interfering with a
            # challenge that is already completing only breaks it.
            if [ "${APPEARANCE:-interaction-only}" = "interaction-only" ]; then
              for n in "${IDX[@]}"; do click_driver "$n" & CLICKERS+=($!); done
            else
              echo "appearance=${APPEARANCE} -- click driver disabled (widget self-solves)"
            fi
            return 0
          }

          stop_instances() {
            local c p
            for c in "${CLICKERS[@]}"; do kill "$c" 2>/dev/null; done
            CLICKERS=()
            for p in "${PIDS[@]}"; do kill "$p" 2>/dev/null; done
            sleep 2
            for p in "${PIDS[@]}"; do kill -9 "$p" 2>/dev/null; done
            # Renderers survive their parent under --no-sandbox and would keep a
            # dead tenure's CPU (and its sockets) alive into the next one.
            pkill -f 'user-data-dir=/tmp/chrome-profile-' 2>/dev/null
            sleep 1
          }

          sum_over() {   # $1 = grep pattern, counted across every instance log
            local s=0 c l
            for l in "${LOGS[@]}"; do c=$(grep -ac "$1" "$l" 2>/dev/null); s=$(( s + ${c:-0} )); done
            echo "$s"
          }

          RUN_START=$(date +%s)
          END=$(( RUN_START + MINUTES * 60 ))
          verified=0; accepted=0; lastcheck=0; vturn=0
          tenure=0; CUM_MINTED=0; ROT_SECS=0; EXIT_BLOCK=0
          : > /tmp/tenures.txt

          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$tenure" -gt 0 ] && [ "$ROTATE_MIN" -gt 0 ]; then
              if [ "$ROTATE_EVERY" -le 1 ] || [ $(( tenure % ROTATE_EVERY )) -eq 0 ]; then
                r0=$(date +%s)
                rotate_tunnel || { echo "[rotate] giving up -- ending run at tenure $tenure"; break; }
                r1=$(date +%s)
                ROT_SECS=$(( ROT_SECS + r1 - r0 ))
                echo "[rotate] handover took $(( r1 - r0 ))s (cumulative ${ROT_SECS}s)"
                EXIT_BLOCK=0
              else
                # Paired control tenure: same exit, fresh browser. Everything
                # the rotation does EXCEPT move the exit.
                EXIT_BLOCK=$(( EXIT_BLOCK + 1 ))
                echo "[rotate] tenure $tenure: BROWSER RESTART ONLY, exit unchanged (block $EXIT_BLOCK on this exit)"
              fi
            fi

            if [ "$ROTATE_MIN" -gt 0 ]; then LBL="${MYRUN}-r${tenure}"; else LBL="$MYRUN"; fi
            set_label "$LBL"
            TEXIT=$(awk 'NR==1{print $3}' /tmp/tunnels.txt)
            tstart=$(date +%s)
            if [ "$ROTATE_MIN" -gt 0 ]; then tend=$(( tstart + ROTATE_MIN * 60 )); else tend=$END; fi
            [ "$tend" -gt "$END" ] && tend=$END
            echo "=============================================="
            echo "[tenure] n=$tenure exit=$TEXIT block=$EXIT_BLOCK label=$LBL start=$tstart planned_end=$tend"
            echo "=============================================="

            if ! start_instances; then
              echo "[tenure] browsers failed to start on $TEXIT"
              stop_instances
              tenure=$(( tenure + 1 ))
              [ "$ROTATE_MIN" -gt 0 ] && continue
              break
            fi

            while [ "$(date +%s)" -lt "$tend" ]; do
              sleep 30
              alive=0
              for p in "${PIDS[@]}"; do kill -0 "$p" 2>/dev/null && alive=$(( alive + 1 )); done
              [ "$alive" -eq 0 ] && { echo "all chrome instances exited"; break; }

              MINTED=$(sum_over 'TOKFULL ')
              CLICKS=$(cat /tmp/clicks-*.log 2>/dev/null | grep -ac '^\[click\]'); CLICKS=${CLICKS:-0}
              NOW=$(date +%s); EL=$(( NOW - tstart ))
              RATE=$(( EL > 0 ? MINTED * 60 / EL : 0 ))
              echo "[summary] tenure=$tenure exit=$TEXIT t=${EL}s minted=$MINTED rate=${RATE}/min clicks=$CLICKS alive=$alive/$NINST"

              # Same-path replay. One token each, so keep it sparse; it is a
              # MINT sanity check and NOT acceptance -- it redeems through the
              # very tunnel that minted, and printed 54/59 during a total
              # outage. Real acceptance is /stats/exits, per minting exit.
              if [ $(( NOW - lastcheck )) -ge "$VERIFY_EVERY" ] && [ "$MINTED" -gt 0 ]; then
                lastcheck=$NOW
                vi=$(( vturn % NINST )); vturn=$(( vturn + 1 ))
                vlog="${LOGS[$vi]}"; vport="${PORTS[$vi]}"; vn="${IDX[$vi]}"
                LINE=$(grep -a 'TOKFULL ' "$vlog" | tail -1 | sed 's/.*TOKFULL //' | sed 's/".*$//' | tr -d '\r')
                FLAG=${LINE%% *}; TOK=${LINE#* }
                if [ -n "$TOK" ] && [ "$TOK" != "$LINE" ]; then
                  if [ "$vport" = "-" ]; then V=$(/tmp/joinverify "$TOK" 2>&1 | tail -1)
                  else V=$(/tmp/joinverify -proxy "$vport" "$TOK" 2>&1 | tail -1); fi
                  verified=$(( verified + 1 ))
                  case "$V" in JOINED*) accepted=$(( accepted + 1 ));; esac
                  echo "[verify] inst=$vn solve=$FLAG len=${#TOK} $V   (running $accepted/$verified same-path-replay)"
                fi
              fi
            done

            TMINT=$(sum_over 'TOKFULL ')
            tstop=$(date +%s); TEL=$(( tstop - tstart )); [ "$TEL" -lt 1 ] && TEL=1
            echo "[tenure-result] n=$tenure exit=$TEXIT label=$LBL minted=$TMINT secs=$TEL rate=$(( TMINT * 60 / TEL ))/min"
            echo "$tenure $TEXIT $LBL $tstart $tstop $TMINT" >> /tmp/tenures.txt
            CUM_MINTED=$(( CUM_MINTED + TMINT ))
            stop_instances
            tenure=$(( tenure + 1 ))
            [ "$ROTATE_MIN" -gt 0 ] || break
          done

          EL=$(( $(date +%s) - RUN_START )); [ "$EL" -lt 1 ] && EL=1
          echo "=============================================="
          echo "[result] tenures=$tenure minted=$CUM_MINTED wallclock=${EL}s whole-cycle-rate=$(( CUM_MINTED * 60 / EL ))/min handover-overhead=${ROT_SECS}s same-path-replay=$accepted/$verified (NOT acceptance -- see /stats/exits)"
          echo "=============================================="
          echo "--- per tenure (n exit label start stop minted) ---"
          cat /tmp/tenures.txt 2>/dev/null
          echo "--- distinct exits used: $(awk '{print $2}' /tmp/tenures.txt 2>/dev/null | sort -u | wc -l) across $tenure tenure(s) ---"
          awk '{print $2}' /tmp/tenures.txt 2>/dev/null | sort | uniq -c | sort -rn
          echo "--- interactive-mode callbacks (last tenure only) ---"
          for pat in BEFORE_INTERACTIVE AFTER_INTERACTIVE; do
            echo "$pat: $(sum_over "$pat")"
          done
          cat "${LOGS[@]}" 2>/dev/null | grep -a 'cf err' | sed 's/.*cf err/cf err/' | sort | uniq -c | sort -rn | head
          if [ "$CUM_MINTED" -eq 0 ]; then
            echo "--- producer console (deduped) ---"
            cat "${LOGS[@]}" 2>/dev/null | grep -a 'producer\]' | grep -av 'TOKFULL' \
              | sed 's/.*\[producer\]/[producer]/' \
              | sed 's/len=[0-9]* head=.*/len=... head=.../' \
              | sort | uniq -c | sort -rn | head -20
            echo "--- off-screen click refusals (window mispositioned) ---"
            sum_over 'CLICKOFFSCREEN'
            echo "--- clicks issued ---"; cat /tmp/clicks-*.log 2>/dev/null | tail -5
            echo "::error::minted 0."
          fi

          # Explicit teardown, AFTER the result is printed. Leaving the
          # browsers, displays and tunnels to the runner's own orphan reaper
          # wedged a run in post-job cleanup for 28+ minutes, and the logs of a
          # run that has to be cancelled are truncated -- the measurement is
          # lost outright. A hung job also holds a concurrency slot, which the
          # ~6-12 min runner drip-feed makes expensive.
          echo "tearing down"
          stop_instances
          pkill -f 'Xvfb :9' 2>/dev/null
          pkill -f 'wireproxy -c' 2>/dev/null
          sudo pkill openvpn 2>/dev/null
          echo "teardown done"
          exit 0

      - name: 7. Dispatch successor
        if: ${{ always() && github.event.inputs.chain == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run gartic-lane-d-rotate.yml -f chain=true; then
              echo "successor dispatched on attempt $attempt"; exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
