name: Gartic producer (Chromium + MV3 extension, WARP)

# Replaces the Camoufox producer fleet, which cannot mint any more:
#
#   1. Its egress is AS8075 Microsoft, which Cloudflare refuses the challenge to
#      (measured 2026-07-24: direct 0 tokens / 93x 600010, WARP 238, VPN Gate 99).
#   2. Its embedded generator renders WITHOUT `action:'join'`, and gartic
#      validates that field server-side -- every such token is refused code 5.
#   3. It pins `camoufox==0.4.11` but `camoufox fetch` now pulls v152, which
#      yields zero tokens.
#
# This workflow is the GitHub port of the recipe that is live and minting on the
# Oracle VM (`tunnel system/vm-chromium-producer/`): a PLAIN Chromium with no
# automation protocol attached, doing the work from an MV3 content script in the
# MAIN world, egressing through an anonymous Cloudflare WARP registration.
#
# On the diagnostic signature that misled the previous session: a healthy
# producer logs `DIAG iframes=0` and fires `before-interactive`. That is what
# `appearance:'interaction-only'` looks like, NOT a failure -- the live VM
# producer prints exactly that while minting. Do not treat it as a verdict.
# The only verdict that counts is the ACCEPTED ratio this workflow prints.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to mint for"
        required: false
        default: "300"
      lanes:
        description: "Parallel Turnstile widgets (2 is the measured optimum)"
        required: false
        default: "2"
      per_min:
        description: "Per-IP mint cap. Above ~12-14 gartic refuses everything."
        required: false
        default: "12"
      post_to_relay:
        description: "POST minted tokens to the relay (false = verify only)"
        required: false
        default: "true"
      chain:
        description: "Dispatch a successor when this run ends"
        required: false
        default: "false"
      forbid_exits:
        # Empty by DEFAULT and it must stay that way. WARP's IPv4 is anycast --
        # every lane shares one address (the VM's lanes all sit on
        # 104.28.196.79) and only the IPv6 /64 actually differs. Seeding this
        # with a v4 makes warp_up.sh reject every roll and fail the job: an
        # earlier run burned all 4 rolls on 104.28.196.79/IAD for exactly that
        # reason. Put a v6 prefix here if a real collision needs excluding.
        description: "WARP exits to refuse. Use IPv6 prefixes -- the v4 is anycast and always collides."
        required: false
        default: ""

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 358

    env:
      AUTH_SECRET: '74b163d6448f638bc82a6c5b9a6e64f1abd06e2bca6c47c148a041a5dc40f434'
      SITEKEY: '0x4AAAAAABBPKaIbNwnPEfSo'
      RELAY: 'https://mohanadino.duckdns.org:8443/add'
      SOCKS_PORT: '25344'

    steps:
      - name: 1. Runner facts (before any tunnel)
        run: |
          echo "direct_egress=$(curl -4 -s --max-time 15 https://api.ipify.org || echo unknown)"
          echo "asn=$(curl -s --max-time 15 https://ipinfo.io/org || echo unknown)"
          google-chrome --version || true
          chromium --version || true

      - name: 2. Install Xvfb + a Chrome that still honours --load-extension
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb unzip

          # The runner's preinstalled Chrome is 150. Chrome REMOVED
          # --load-extension in M137 (and the
          # --disable-features=DisableLoadExtensionCommandLineSwitch escape
          # hatch with it), so on the stock browser the extension silently never
          # runs -- which is exactly how this failed on the first attempt.
          # Chrome for Testing 136 is the last line that still loads it, and
          # pinning is the same discipline the Camoufox v135 pin exists for.
          #
          # NOT the apt `chromium` package: on 24.04 that is a snap wrapper
          # whose confinement cannot read /tmp/ext.
          VER=$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r '[.versions[]
                      | select((.version | split(".")[0] | tonumber) == 136)
                      | select(any(.downloads.chrome[]?; .platform == "linux64"))
                      | .version] | last')
          [ -n "$VER" ] && [ "$VER" != "null" ] || { echo 'no Chrome-for-Testing 136 build found' >&2; exit 1; }
          echo "pinning Chrome for Testing $VER"
          curl -fsSL --retry 3 -o /tmp/cft.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$VER/linux64/chrome-linux64.zip"
          sudo unzip -q /tmp/cft.zip -d /opt
          sudo chmod -R a+rX /opt/chrome-linux64
          echo "CHROME_BIN=/opt/chrome-linux64/chrome" >> "$GITHUB_ENV"
          /opt/chrome-linux64/chrome --version

      - name: 3. Bring up Cloudflare WARP (SOCKS5) -- FATAL if it fails
        env:
          WARP_FORBID_EXITS: ${{ github.event.inputs.forbid_exits }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/warp && cd /tmp/warp
          echo '' | base64 -d > warp_up.sh
          chmod +x warp_up.sh
          # Falling through to the runner's own egress would mint nothing but
          # 600010 for hours, so a failed tunnel must kill the job.
          ./warp_up.sh "$SOCKS_PORT" | tee /tmp/warp.txt | sed 's/^/warp_/'
          echo "EXITIP=$(sed -n 's/^exit_v4=//p' /tmp/warp.txt | tail -1)" >> "$GITHUB_ENV"
          echo "EXITV6=$(sed -n 's/^exit_ip=//p' /tmp/warp.txt | tail -1)" >> "$GITHUB_ENV"

      - name: 4a. Go toolchain (joinverify needs >= the version in its go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: 4. Build the join verifier
        run: |
          set -euo pipefail
          mkdir -p /tmp/jv && cd /tmp/jv
          echo '' | base64 -d | tar xzf -
          go build -o /tmp/joinverify .
          # A verifier that cannot answer REJECTED for an obviously bogus token
          # is measuring itself, not gartic.
          /tmp/joinverify -proxy "socks5://127.0.0.1:$SOCKS_PORT" '1.AAAAAAAAAAAA.BBBBBBBB' \
            | sed 's/^/selftest(bogus token, expect REJECTED code=5): /'

      - name: 5. Write the MV3 extension
        env:
          LANES: ${{ github.event.inputs.lanes }}
          PER_MIN: ${{ github.event.inputs.per_min }}
          POST_TO_RELAY: ${{ github.event.inputs.post_to_relay }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ext
          cat > /tmp/ext/manifest.json <<'MANIFEST'
          {
            "manifest_version": 3,
            "name": "gartic token producer",
            "version": "1.0",
            "host_permissions": ["https://gartic.io/*", "https://mohanadino.duckdns.org/*"],
            "content_scripts": [{
              "matches": ["https://gartic.io/*"],
              "js": ["producer.js"],
              "run_at": "document_idle",
              "world": "MAIN"
            }]
          }
          MANIFEST

          # Runner variant of tunnel system/vm-chromium-producer/producer.js.
          # Only difference: it emits the FULL token on a `TOKFULL` line so the
          # job can verify acceptance. That line goes to the Chrome log file,
          # which is never printed or uploaded -- the repo is public.
          cat > /tmp/ext/producer.js <<'PRODUCER'
          (function () {
            'use strict';
            var RELAY  = '__RELAY__';
            var SECRET = '__SECRET__';
            var KEY    = '__SITEKEY__';
            var LANES  = __LANES__;
            var PER_MIN = __PER_MIN__;
            var POST = __POST__;
            var GAP = Math.round(60000 / PER_MIN);
            var nextAllowed = 0, minted = 0, posted = 0;

            function log(){ console.log.apply(console, ['[producer]'].concat([].slice.call(arguments))); }

            function post(tok) {
              if (!POST) { posted++; return; }
              fetch(RELAY, { method:'POST',
                headers:{'Content-Type':'application/json','X-Auth':SECRET},
                body: JSON.stringify({token: tok})
              }).then(function(r){ if(r.ok){posted++;} log('posted', r.status, 'minted='+minted, 'posted='+posted); })
                .catch(function(e){ log('relay error', e && e.message); });
            }

            function lane(i) {
              var slot, id;
              function build() {
                slot = document.createElement('div');
                slot.id = 'prod_' + i;
                slot.style.cssText = 'position:fixed;left:' + (10 + i*180) + 'px;bottom:10px;z-index:2147483647';
                document.body.appendChild(slot);
                try {
                  id = window.turnstile.render(slot, {
                    sitekey: KEY, action: 'join', appearance: 'interaction-only',
                    callback: function(){},
                    'error-callback': function(c){ log('cf err', c); setTimeout(recycle, 2000); },
                    'before-interactive-callback': function(){ log('BEFORE_INTERACTIVE (lane '+i+')'); },
                    'after-interactive-callback': function(){ log('AFTER_INTERACTIVE (lane '+i+')'); },
                    'timeout-callback': function(){ recycle(); }
                  });
                } catch (e) { log('render threw', e && e.message); setTimeout(recycle, 3000); return; }
                poll(0);
              }
              function read() {
                try { var t = window.turnstile.getResponse(id); if (t) return t; } catch(e){}
                var el = slot && slot.querySelector('input[name="cf-turnstile-response"]');
                return el && el.value ? el.value : null;
              }
              function poll(n) {
                var t = read();
                if (t) {
                  var now = Date.now();
                  var wait = Math.max(0, nextAllowed - now);
                  nextAllowed = Math.max(now, nextAllowed) + GAP;
                  minted++;
                  log('TOKEN lane'+i, 'len='+t.length, 'head='+t.slice(0,16));
                  log('TOKFULL ' + t);
                  setTimeout(function(){ post(t); }, wait);
                  setTimeout(recycle, wait + 500);
                  return;
                }
                if (n > 60) { recycle(); return; }
                setTimeout(function(){ poll(n+1); }, 1000);
              }
              function recycle() {
                try { window.turnstile.remove(id); } catch(e){}
                if (slot && slot.parentNode) slot.parentNode.removeChild(slot);
                setTimeout(build, 300);
              }
              return build;
            }

            setInterval(function(){
              var ifr = document.querySelectorAll('iframe[src*="challenges.cloudflare.com"]').length;
              var boxes = document.querySelectorAll('[id^="prod_"]').length;
              log('DIAG iframes=' + ifr + ' lanes=' + boxes + ' minted=' + minted + ' posted=' + posted);
            }, 20000);

            var waited = 0;
            (function wait() {
              if (window.turnstile && window.turnstile.render) {
                log('turnstile present -- starting', LANES, 'lanes');
                for (var i = 0; i < LANES; i++) setTimeout(lane(i), i * 800);
                return;
              }
              if ((waited += 250) > 60000) { log('window.turnstile NEVER appeared'); return; }
              setTimeout(wait, 250);
            })();
          })();
          PRODUCER

          if [ "$POST_TO_RELAY" = "true" ]; then POSTJS=true; else POSTJS=false; fi
          sed -i "s|__RELAY__|$RELAY|; s|__SECRET__|$AUTH_SECRET|; s|__SITEKEY__|$SITEKEY|; s|__LANES__|$LANES|; s|__PER_MIN__|$PER_MIN|; s|__POST__|$POSTJS|" /tmp/ext/producer.js
          grep -c . /tmp/ext/producer.js

      - name: 6. Mint
        timeout-minutes: 350
        continue-on-error: true
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          # GitHub invokes every step as `bash -e`, and `set -uo pipefail` does
          # NOT clear that. A monitoring loop must not be fatal: `grep -c`
          # exits 1 when the count is zero, so `MINTED=$(grep -ac ...)` killed
          # this step 30s in, before the first token had been minted.
          set +e +o pipefail
          export DISPLAY=:97
          Xvfb :97 -screen 0 1280x900x24 -ac -nolisten tcp >/dev/null 2>&1 &
          sleep 3

          LOG=/tmp/chrome.log
          : > "$LOG"
          # Plain browser, no automation protocol. --proxy-server sends every
          # request (including the relay POST) through WARP; Chromium resolves
          # DNS remotely for socks5://, so nothing leaks to the runner resolver.
          # DisableLoadExtensionCommandLineSwitch: Chrome >=137 ignores
          # --load-extension without it.
          "$CHROME_BIN" \
            --no-sandbox --disable-gpu --no-first-run --no-default-browser-check \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/chrome-profile \
            --proxy-server="socks5://127.0.0.1:$SOCKS_PORT" \
            --disable-features=DisableLoadExtensionCommandLineSwitch \
            --disable-extensions-except=/tmp/ext \
            --load-extension=/tmp/ext \
            --enable-logging=stderr --v=0 \
            "https://gartic.io/" >> "$LOG" 2>&1 &
          CHROME_PID=$!

          # Fail fast and loudly if the extension never ran at all -- that is a
          # different bug from "the challenge did not solve", and conflating the
          # two is what cost the previous session its diagnosis.
          for _ in $(seq 1 24); do
            grep -aq '\[producer\]' "$LOG" && break
            sleep 5
          done
          if ! grep -aq '\[producer\]' "$LOG"; then
            echo "::error::extension never executed -- --load-extension was ignored or the page never loaded"
            echo "--- chrome version ---"; "$CHROME_BIN" --version
            echo "--- last 40 log lines ---"; tail -40 "$LOG"
            exit 1
          fi
          echo "extension is running"

          END=$(( $(date +%s) + MINUTES * 60 ))
          verified=0; accepted=0; lastcheck=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30
            kill -0 "$CHROME_PID" 2>/dev/null || { echo "chrome exited"; break; }

            # grep -c always prints a number but exits 1 on no match, so a
            # `|| echo 0` fallback would capture "0\n0" and break the arithmetic.
            MINTED=$(grep -ac 'TOKFULL ' "$LOG" 2>/dev/null || true); MINTED=${MINTED:-0}
            POSTED=$(grep -ao 'posted=[0-9]*' "$LOG" 2>/dev/null | tail -1 || true); POSTED=${POSTED:-posted=0}
            NOW=$(date +%s)
            echo "[summary] t=$(( NOW - (END - MINUTES*60) ))s minted=$MINTED $POSTED accepted=$accepted/$verified exit=${EXITIP:-unknown}"

            # Verify one fresh token every ~3 min. Tokens are single-use, so a
            # verified one is spent -- keep this sparse. Never print the token.
            if [ $(( NOW - lastcheck )) -ge 180 ] && [ "$MINTED" -gt 0 ]; then
              lastcheck=$NOW
              TOK=$(grep -a 'TOKFULL ' "$LOG" | tail -1 | sed 's/.*TOKFULL //' | tr -d '\r' | tr -d '"')
              if [ -n "$TOK" ]; then
                V=$(/tmp/joinverify -proxy "socks5://127.0.0.1:$SOCKS_PORT" "$TOK" 2>&1 | tail -1)
                verified=$(( verified + 1 ))
                case "$V" in JOINED*) accepted=$(( accepted + 1 ));; esac
                echo "[verify] $V   (running $accepted/$verified ACCEPTED)"
              fi
            fi
          done

          MINTED=$(grep -ac 'TOKFULL ' "$LOG" 2>/dev/null || true); MINTED=${MINTED:-0}
          echo "=============================================="
          echo "[result] exit_ip=${EXITIP:-unknown} minted=$MINTED accepted=$accepted/$verified"
          echo "=============================================="
          grep -a 'cf err' "$LOG" | sed 's/.*cf err/cf err/' | sort | uniq -c | sort -rn | head
          if [ "$MINTED" -eq 0 ]; then
            echo "::error::minted 0 -- check 'cf err' codes above (600010=ASN/browser refused, 300030=exit collision)"
          fi

      - name: 7. Dispatch successor
        if: ${{ always() && github.event.inputs.chain == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run gartic-chromium-warp.yml -f chain=true; then
              echo "successor dispatched on attempt $attempt"; exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
