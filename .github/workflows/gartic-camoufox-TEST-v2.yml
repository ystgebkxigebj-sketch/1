name: Gartic Camoufox TEST (v2 method, single worker)

# A DIAGNOSTIC worker, not a producer. It answers one question:
#   does Camoufox mint gartic Turnstile tokens from a GitHub runner IP?
#
# On the Oracle VM it does not: window.turnstile appears, the widget fires
# `before-interactive`, and Cloudflare then renders NO iframe at all — so there
# is nothing to solve or click. On the user's real Chrome (residential IP) the
# same sitekey mints a 645-char token immediately. An automated Chromium on that
# SAME residential IP fails too, which points at automation detection rather
# than IP reputation — but that browser advertises a "Claude/1." user-agent, so
# it is not a clean verdict on Camoufox. This workflow settles it on a clean
# GitHub IP with the stealth browser.
#
# Deliberately NOT part of the producer chain: no successor dispatch, bounded
# runtime, one runner. Read the log, then delete or keep as needed.
#
# RATE: unthrottled (--rate 0). The 12 tok/min cap that the browser producer
# needs is a PER-IP limit — past it, Cloudflare keeps issuing tokens but
# gartic's siteverify refuses them. A GitHub runner is a fresh IP each job, so
# that ceiling does not apply here and throttling would only hide the answer.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run the probe"
        required: false
        default: "10"
      lanes:
        description: "Parallel Turnstile widgets"
        required: false
        default: "5"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: 1. System deps for Camoufox/Firefox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends               libgtk-3-0 libxt6 libdbus-glib-1-2 libpci3 libxss1 libnss3 fonts-liberation
          sudo apt-get install -y --no-install-recommends libasound2t64               || sudo apt-get install -y --no-install-recommends libasound2 || true

      - name: 2. Drop generator_v2 at /opt/camoufox
        env:
          GEN_B64: ''
        run: |
          sudo mkdir -p /opt/camoufox
          sudo chown "$USER":"$USER" /opt/camoufox
          echo "$GEN_B64" | base64 -d > /opt/camoufox/generator_v2.py
          wc -c /opt/camoufox/generator_v2.py

      - name: 3. Install camoufox (LATEST, not the old 0.4.11 pin)
        working-directory: /opt/camoufox
        run: |
          # ubuntu-24.04 ships Python 3.12, so pip can resolve camoufox 0.5.x —
          # the launcher that actually matches the v152 browser that
          # `camoufox fetch` downloads. The producer workflow pins
          # camoufox==0.4.11 (Jan 2025) while fetching a Jul 2026 browser, an
          # 18-month mismatch. Let pip pick a matched pair here.
          python3 -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet "camoufox[geoip]"
          ./venv/bin/python -m pip show camoufox playwright | grep -E "^Name|^Version"
          ./venv/bin/python -m camoufox fetch
          ./venv/bin/python - <<'EOF'
          import glob, os
          hits = glob.glob(os.path.expanduser("~/.cache/camoufox/camoufox-bin"))
          print("browser binary:", hits or "NOT FOUND")
          EOF

      - name: 4. Probe — does it mint on a GitHub IP?
        working-directory: /opt/camoufox
        env:
          # Optional. With no secret configured the probe still answers the
          # minting question; it just does not forward tokens to the relay.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          echo "runner egress IP: $(curl -s https://api.ipify.org || echo unknown)"
          RELAY=""
          if [ -n "$AUTH_SECRET" ]; then RELAY="https://mohanadino.duckdns.org:8443/add"; fi
          echo "relay: ${RELAY:-<not posting, no AUTH_SECRET secret set>}"
          MIN="${{ github.event.inputs.minutes || '10' }}"
          LANES="${{ github.event.inputs.lanes || '2' }}"
          PYTHONUNBUFFERED=1 ./venv/bin/python -u generator_v2.py             --lanes "$LANES"             --duration "$(( MIN * 60 ))"             --rate 0             --relay-url "$RELAY"             --auth-secret "$AUTH_SECRET"

      - name: 5. Verdict
        if: always()
        run: |
          echo "Read step 4's log:"
          echo "  [token] lines            -> Camoufox CAN mint on a GitHub IP. The block is IP/reputation-based."
          echo "  'window.turnstile NEVER appeared' -> Cloudflare refused to initialise the widget at all."
          echo "  'before-interactive' + iframes=0  -> challenge demanded interaction and rendered nothing."
          echo "                                       Same as the Oracle VM: automation detection, not IP."
